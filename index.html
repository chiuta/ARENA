<meta name="description" content="Arena fără frontiere — dueluri oarbe între modele AI, clasament Elo, totul offline-first, într-un singur fișier. Fișierul e al tău.">
<title>Arena fără frontiere</title>
<style>
:root{
  --bg:#161320; --panel:#1e1a2b; --panel2:#262138; --line:#372f52; --line2:#4a4070;
  --text:#ece7db; --dim:#9b93ac; --faint:#9088a8;
  --gold:#d9a441; --gold-soft:#e8c37a; --teal:#4ec2b3; --teal-soft:#8adfd3;
  --red:#e07a7a; --green:#7fbf7a;
  --r:12px;
  --serif:"Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--line2) var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(ellipse 90% 55% at 50% -12%,rgba(217,164,65,.09),transparent 62%),
                   radial-gradient(ellipse 75% 45% at 50% 112%,rgba(78,194,179,.06),transparent 60%)}
a{color:var(--gold-soft)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
::placeholder{color:var(--faint)}

/* ------- shell ------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header{padding:26px 0 10px;text-align:center}
.title{margin:0;font-weight:400;font-family:var(--serif);font-size:clamp(26px,4.5vw,40px);letter-spacing:.06em;color:var(--gold-soft)}
.title b{font-weight:400;color:var(--text)}
.laurel{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--faint);margin-top:4px}
.laurel::before,.laurel::after{content:"";height:1px;width:min(160px,26vw);background:linear-gradient(90deg,transparent,var(--line2));}
.laurel::after{background:linear-gradient(90deg,var(--line2),transparent)}
.tagline{font-size:12.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
#nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px}
#nav button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:13.5px;letter-spacing:.04em}
#nav button:hover{color:var(--text);border-color:var(--line2)}
#nav button.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:600}
.langs{margin:0;position:absolute;top:14px;right:14px;display:flex;gap:4px}
.langs button{padding:4px 9px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.langs button.on{color:var(--gold-soft);border-color:var(--gold)}
main section{display:none}
main section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ------- prompt bar ------- */
.promptbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.promptbox textarea{min-height:74px;resize:vertical;background:var(--bg)}
.pb-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241c08;font-weight:700}
.btn.primary:hover{background:var(--gold-soft)}
.btn.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--faint)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest button{font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:999px;padding:4px 10px}
.suggest button:hover{color:var(--gold-soft);border-color:var(--gold)}

/* ------- duel panes ------- */
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:220px;overflow:hidden}
.pane.a{border-top:3px solid var(--gold)}
.pane.b{border-top:3px solid var(--teal)}
.pane-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--serif);letter-spacing:.05em}
.pane.a .pane-h{color:var(--gold-soft)} .pane.b .pane-h{color:var(--teal-soft)}
.pane-h .who{font-size:16px}
.pane-h .real{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.pane-h .delta{font-family:var(--mono);font-size:12px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.pane-b{padding:14px;white-space:pre-wrap;overflow-wrap:break-word;flex:1;font-size:14.5px}
.pane-b.err{color:var(--red)}
.cursor::after{content:"▍";color:var(--gold);animation:blink 1s steps(1) infinite}
.pane.b .cursor::after{color:var(--teal)}
@keyframes blink{50%{opacity:0}}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:conic-gradient(from 210deg,var(--gold) 0 50%,var(--teal) 50% 100%);padding:2px;z-index:2;pointer-events:none}
.vs i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
  background:var(--bg);font-family:var(--serif);font-style:normal;font-size:17px;letter-spacing:.08em;color:var(--text)}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.vote button{padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13.5px}
.vote button:hover:not(:disabled){transform:translateY(-1px)}
.vote .va:hover:not(:disabled){border-color:var(--gold);color:var(--gold-soft)}
.vote .vb:hover:not(:disabled){border-color:var(--teal);color:var(--teal-soft)}
.vote button:disabled{opacity:.4;cursor:not-allowed}
.verdict{margin-top:14px;text-align:center;font-family:var(--serif);font-size:17px;color:var(--gold-soft);display:none}
.verdict.on{display:block;animation:fade .4s ease}
.postrow{display:none;justify-content:center;gap:10px;margin-top:12px}
.postrow.on{display:flex}

/* ------- leaderboard ------- */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr:last-child td{border-bottom:none}
td .rk{font-family:var(--serif);color:var(--gold-soft);font-size:15px}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal))}
.empty{padding:34px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}

/* ------- compare ------- */
.cmp-sel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.cmp-sel label{font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}

/* ------- settings ------- */
.cardlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mcard .nm{font-family:var(--serif);font-size:16px}
.mcard .meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
.mcard .sp{flex:1}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:5px;padding:2px 7px;color:var(--dim)}
.tag.demo{color:var(--teal-soft);border-color:var(--teal)}
.mini{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.mini:hover{color:var(--text);border-color:var(--line2)}
.mini.danger:hover{color:var(--red);border-color:var(--red)}
.st{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.st.ok{color:var(--green);border-color:var(--green)}
.st.bad{color:var(--red);border-color:var(--red)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;display:none}
.form.on{display:block}
.form h3{font-family:var(--serif);font-weight:400;margin-bottom:10px;color:var(--gold-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;display:block;margin:6px 0 3px}
.io{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.note{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.6}
h2.sec{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--gold-soft);letter-spacing:.04em;margin:6px 0 10px}
.toggle{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.toggle.on{background:var(--gold)}
.toggle.on::after{transform:translateX(16px);background:#241c08}

/* ------- free catalog ------- */
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.gcard .gh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.gcard .gn{font-family:var(--serif);font-size:16px;color:var(--gold-soft)}
.gcard .gk{flex:1;min-width:180px}
.gcard .gk input{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.chip:hover{color:var(--teal-soft);border-color:var(--teal)}
.chip.in{color:var(--faint);border-style:dashed;cursor:default}
.gnote{font-size:12px;color:var(--faint);margin-top:8px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:10px}
.fbar input[type=search]{flex:1;min-width:160px;padding:6px 10px;font-size:13px}
.fbar select{width:auto;padding:6px 10px;font-size:13px}
.fchip{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.fchip.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:600}
.fcount{font-family:var(--mono);font-size:12px;color:var(--faint);width:100%;margin-top:2px}
.gnote a{color:var(--teal-soft)}

/* ------- toast ------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-size:14px;transition:transform .25s ease;z-index:9}
#toast.on{transform:translateX(-50%) translateY(0)}

footer{margin-top:44px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8}
footer .sig{font-family:var(--serif);letter-spacing:.08em;color:var(--dim)}

@media(max-width:760px){
  .duel,.cmp-sel,.grid2{grid-template-columns:1fr}
  .vs{display:none}
  .vote{grid-template-columns:1fr 1fr}
  .langs{position:static;justify-content:center;margin-top:8px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}

<body>
<nav class="langs" id="langs" aria-label="Limbă / Language"></nav>
<div class="wrap">

<header>
  <h1 class="title">ARENA <b>fără frontiere</b></h1>
  <div class="laurel"><span class="tagline" data-i18n="tagline"></span></div>
</header>

<nav id="nav">
  <button data-tab="duel" class="on" data-i18n="tab_duel"></button>
  <button data-tab="cmp" data-i18n="tab_cmp"></button>
  <button data-tab="board" data-i18n="tab_board"></button>
  <button data-tab="set" data-i18n="tab_set"></button>
</nav>

<main>

<!-- ============ DUEL ============ -->
<section id="tab-duel" class="on">
  <div class="promptbox">
    <textarea id="d-prompt" data-i18n-ph="prompt_ph"></textarea>
    <div class="suggest" id="d-suggest"></div>
    <div class="pb-row">
      <button class="btn primary" id="d-go" data-i18n="fight"></button>
      <button class="btn" id="d-stop" style="display:none" data-i18n="stop"></button>
      <span class="hint" data-i18n="duel_hint"></span>
    </div>
  </div>

  <div class="duel">
    <div class="pane a">
      <div class="pane-h"><span class="who" id="d-wa">⚔ A</span><span class="real" id="d-ra"></span><span class="delta" id="d-da"></span></div>
      <div class="pane-b" id="d-pa"></div>
    </div>
    <div class="vs"><i>VS</i></div>
    <div class="pane b">
      <div class="pane-h"><span class="who" id="d-wb">⚔ B</span><span class="real" id="d-rb"></span><span class="delta" id="d-db"></span></div>
      <div class="pane-b" id="d-pb"></div>
    </div>
  </div>

  <div class="vote">
    <button class="va" id="v-a" disabled data-i18n="v_a"></button>
    <button class="vb" id="v-b" disabled data-i18n="v_b"></button>
    <button id="v-tie" disabled data-i18n="v_tie"></button>
    <button id="v-bad" disabled data-i18n="v_bad"></button>
  </div>

  <p class="note" data-i18n="kb_hint"></p>
    <div class="verdict" id="d-verdict"></div>
  <div class="postrow" id="d-post">
    <button class="btn primary" id="d-again" data-i18n="again"></button>
  </div>
</section>

<!-- ============ COMPARE ============ -->
<section id="tab-cmp">
  <div class="cmp-sel">
    <div><label for="c-selA" data-i18n="cmp_left"></label><select id="c-selA"></select></div>
    <div><label for="c-selB" data-i18n="cmp_right"></label><select id="c-selB"></select></div>
  </div>
  <div class="promptbox">
    <textarea id="c-prompt" data-i18n-ph="prompt_ph"></textarea>
    <div class="pb-row">
      <button class="btn primary" id="c-go" data-i18n="compare"></button>
      <span class="hint" data-i18n="cmp_hint"></span>
    </div>
  </div>
  <div class="duel">
    <div class="pane a">
      <div class="pane-h"><span class="who" id="c-wa">—</span></div>
      <div class="pane-b" id="c-pa"></div>
    </div>
    <div class="pane b">
      <div class="pane-h"><span class="who" id="c-wb">—</span></div>
      <div class="pane-b" id="c-pb"></div>
    </div>
  </div>
</section>

<!-- ============ LEADERBOARD ============ -->
<section id="tab-board">
  <h2 class="sec" data-i18n="board_title"></h2>
  <div id="board-wrap"></div>
  <div class="io">
    <button class="btn" id="b-csv" data-i18n="board_csv"></button>
    <button class="btn" id="b-reset" data-i18n="board_reset"></button>
  </div>
  <p class="note" data-i18n="board_note"></p>
</section>

<!-- ============ SETTINGS ============ -->
<section id="tab-set">
  <h2 class="sec" data-i18n="set_models"></h2>
  <div class="cardlist" id="mlist"></div>
  <div class="io">
    <button class="btn primary" id="m-add" data-i18n="add_model"></button>
    <button class="btn" id="m-testall" data-i18n="test_all"></button>
  </div>

  <div class="form" id="mform">
    <h3 id="mf-title"></h3>
    <div class="grid2">
      <div class="full"><label for="f-name" data-i18n="f_name"></label><input id="f-name" placeholder="ex: Claude Sonnet 4.6"></div>
      <div><label for="f-prov" data-i18n="f_prov"></label>
        <select id="f-prov">
          <option value="openai">OpenAI-compatible</option>
          <option value="pollinations">Pollinations (cheie opțională)</option>
          <option value="browser">În browser (WebLLM · WebGPU)</option>
          <option value="chromeai">AI încorporat în browser (Gemini Nano)</option>
          <option value="transformersjs">Transformers.js (WASM/WebGPU)</option>
          <option value="anthropic">Anthropic</option>
          <option value="ollama">Ollama (local)</option>
        </select>
      </div>
      <div><label for="f-model" data-i18n="f_model"></label><input id="f-model" placeholder="ex: claude-sonnet-4-6"></div>
      <div class="full"><label for="f-url" data-i18n="f_url"></label><input id="f-url" placeholder="https://api.openai.com/v1"></div>
      <div class="full"><label for="f-key" data-i18n="f_key"></label><input id="f-key" type="password" autocomplete="off" placeholder="sk-…"></div>
    </div>
    <div class="pb-row">
      <button class="btn primary" id="mf-save" data-i18n="save"></button>
      <button class="btn" id="mf-cancel" data-i18n="cancel"></button>
    </div>
  </div>

  <h2 class="sec" style="margin-top:26px" data-i18n="cat_title"></h2>
  <p class="note" data-i18n="cat_note"></p>
  <div class="fbar" id="fbar">
    <input type="search" id="f-q" data-i18n-ph="f_search">
    <span id="f-cats"></span>
    <select id="f-reg" aria-label="Regiune / Region"></select>
    <span class="fcount" id="f-count"></span>
  </div>
  <div class="io" style="margin-top:10px"><button class="btn primary" id="sync-all" data-i18n="sync_all"></button></div>
  <div id="catlist"></div>

  <h2 class="sec" style="margin-top:26px" data-i18n="set_data"></h2>
  <div class="io">
    <button class="btn" id="io-export" data-i18n="exportd"></button>
    <button class="btn" id="io-import" data-i18n="importd"></button>
    <button class="btn" id="io-wipe" data-i18n="wipe"></button>
    <label class="note" style="display:block;width:100%;margin-top:6px"><input type="checkbox" id="io-keys"> <span data-i18n="export_keys"></span></label>
    <input type="file" id="io-file" accept="application/json" style="display:none">
  </div>
  <p class="note"><label><input type="checkbox" id="keys-session"> <span data-i18n="keys_session"></span></label></p>
  <p class="note" data-i18n="set_note"></p>
</section>

</main>

<footer>
  <span class="sig">Arena fără frontiere</span><br>
  <span data-i18n="foot"></span><br>
  <span data-i18n="cloudnote"></span><br>
  <span><span data-i18n="verLabel">Versiune</span> <span id="app-version">v 1.3.4 · 2026-10-22</span></span>
</footer>
</div>

 analist:{ro:{name:"Analistul (demo)",open:["Să structurăm.","Descompun problema în trei părți.","Metodic:"],mid:["Întâi definițiile: fără termeni clari, orice concluzie e fragilă. Apoi datele: ce știm sigur, ce doar presupunem. La final, inferența: pasul cel mai mic care leagă una de alta.","Ipoteza de lucru trebuie să fie falsificabilă; altfel discutăm gusturi, nu fapte. Verific premisele una câte una și marchez explicit incertitudinea.","Există cel puțin două interpretări plauzibile. Le compar după predicțiile pe care le fac, nu după cât de elegant sună."],close:["Concluzie provizorie, deschisă la revizuire.","Q.E.D. — cu asterisc.","Datele noi bat opiniile vechi."]},
              en:{name:"The Analyst (demo)",open:["Let's structure this.","I'll decompose the problem into three parts.","Methodically:"],mid:["First, definitions: without clear terms, any conclusion is fragile. Then the data: what we know, what we merely assume. Finally, inference: the smallest step linking one to the other.","A working hypothesis must be falsifiable; otherwise we're discussing taste, not fact. I check premises one by one and mark uncertainty explicitly.","There are at least two plausible readings. I compare them by the predictions they make, not by how elegant they sound."],close:["Provisional conclusion, open to revision.","Q.E.D. — with an asterisk.","New data beats old opinions."]},

 sceptic:{ro:{name:"Scepticul (demo)",open:["Stai puțin.","Înainte de răspuns, o obiecție.","Hm — întrebarea ascunde o premisă."],mid:["Cine spune că întrebarea e pusă corect? De multe ori răspunsul greșit vine dintr-o întrebare acceptată prea repede.","Aș vrea surse, nu impresii. Până atunci, răspunsul cinstit e „nu știm încă destul”.","Atenție la ce pare evident: evidentul e locul unde se ascund cele mai vechi erori."],close:["Îndoiala rămâne cel mai bun instrument din arenă.","Verifică-mă. Serios.","Nu mă crede pe cuvânt — asta e tot mesajul."]},

  rapsod:{name:"O Rapsodo (demo)",open:["Imagina por um instante:","Escuta:","Há uma velha história dentro da tua pergunta —"],mid:["cada ideia é um grão de areia na arena do tempo, e no entanto a areia guarda os passos dos gladiadores.","o que perguntas, outros perguntaram junto a outras fogueiras, e a resposta mudou com cada língua em que foi dita.","há uma beleza discreta em ainda não saber — esse espaço é o lugar onde o pensamento cresce."],close:["Assim termina o canto; o teu começa agora.","E a arena, como sempre, aplaude a pergunta, não a resposta.","Ponto final, e outra vez do início."]},

 hu:{laconic:{name:"A Szűkszavú (demó)",open:["Röviden:","Egyenesen:","A lényeg:"],mid:["Itt csak egy dolog számít — a kérdés magja.","A többi zaj; csak azt tartsd meg, amit ellenőrizni tudsz.","Ha nem fér bele egy mondatba, akkor még nem értették meg."],close:["Ennyi.","A többi gyakorlatnak marad az olvasóra.","Egyszerű."]},

imits per model.","ModelScope · 魔搭 (Alibaba)":"Free: 2000 calls/day in total, max 500/model (100/day for the large DeepSeek models) · requires an Alibaba account with identity verification · Qwen3.5 shows up here first — use ⟳ for the full list.","SiliconFlow · 硅基流动":"Small models free permanently + ~20M tokens on sign-up (CN account; international: api.siliconflow.com, ~$1 credit) · the list of 0¥ models rotates — use ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite free + ~100M tokens when the service is activated · Tencent Cloud account.","Baidu Qianfan · 百度千帆":"ERNIE Speed and Lite free · Baidu Cloud account.","iFlytek Spark · 讯飞星火":"Spark Lite free and unlimited · the key is written APIKey:APISecret (with a colon between them).","Moonshot Kimi · 月之暗面":"Trial credits on sign-up · CN endpoint: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Trial: 1,000,000 tokens per model, 90 days (Singapore endpoint).","În browser · WebLLM (WebGPU)":"The AI runs right in this page, on your GPU, through WebGPU — zero server, zero key. On first use it downloads the model (0.6–2 GB, then it stays in the browser cache) and the WebLLM library from esm.run — the only exception to “zero dependencies”, optional and triggered only by you.","LM Studio (local)":"Start the server from the Developer tab and enable CORS in the server settings · ⟳ lists the loaded models — use it, the static ID below is only a guide.","Jan (local)":"Enable the API Server in Jan's settings (with CORS) · ⟳ lists the installed models.","llama.cpp / llamafile (local)":"“llama-server -m model.gguf” or double-click a llamafile · the server accepts any model ID · CORS is allowed by default.","GPT4All (local)":"Enable “Local API Server” in Settings · ⟳ lists the models.","KoboldCpp (local)":"OpenAI-compatible endpoint active by default on port 5001.","vLLM (local/server)":"“vllm serve <model>” · for browser access start it with --allowed-origins '[\"*\"]'.","AI încorporat în browser · Gemini Nano":"Prompt API in Chrome/ t gratuits avec une clé · limites par modèle.","ModelScope · 魔搭 (Alibaba)":"Gratuit : 2000 appels/jour au total, max 500/modèle (100/jour pour les grands DeepSeek) · exige un compte Alibaba avec vérification d'identité · Qwen3.5 apparaît ici en premier — utilise ⟳ pour la liste complète.","SiliconFlow · 硅基流动":"Petits modèles gratuits en permanence + ~20 M de tokens à l'inscription (compte CN ; international : api.siliconflow.com, ~1 $ de crédit) · la liste des modèles à 0 ¥ tourne — utilise ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite gratuit + ~100 M de tokens à l'activation du service · compte Tencent Cloud.","Baidu Qianfan · 百度千帆":"ERNIE Speed et Lite gratuits · compte Baidu Cloud.","iFlytek Spark · 讯飞星火":"Spark Lite gratuit et illimité · la clé s'écrit APIKey:APISecret (avec deux-points entre les deux).","Moonshot Kimi · 月之暗面":"Crédits d'essai à l'inscription · endpoint CN : api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Essai : 1 000 000 de tokens par modèle, 90 jours (endpoint Singapour).","În browser · WebLLM (WebGPU)":"L'IA tourne directement dans cette page, sur ton GPU, via WebGPU — zéro serveur, zéro clé. À la première utilisation, elle télécharge le modèle (0,6–2 Go, puis il reste dans le cache du navigateur) et la bibliothèque WebLLM depuis esm.run — la seule exception au « zéro dépendance », facultative et déclenchée uniquement par toi.","LM Studio (local)":"Démarre le serveur depuis l'onglet Developer et active CORS dans les paramètres du serveur · ⟳ liste les modèles chargés — utilise-le, l'ID statique ci-dessous n'est qu'indicatif.","Jan (local)":"Active l'API Server dans les paramètres de Jan (avec CORS) · ⟳ liste les modèles installés.","llama.cpp / llamafile (local)":"« llama-server -m model.gguf » ou double-clic sur un llamafile · le serveur accepte n'importe quel ID de modèle · CORS est autorisé par défaut.","GPT4All (local)":"Active « Local API Server » dans Settings · ⟳ liste les modèles.","KoboldCpp (local)":"Endpoint compatible OpenAI actif par défaut sur le port 5001.","vLLM (local/server)":"« vllm serve <model> » · pour un accès depuis le navigateur, démarre avec --allowed-origins '[\"*\"]'.","AI încorporat în browser · Gemini Nano":"Prompt API de Chrome/Edge — le modèle est géré et téléchargé une seule fois par le navigateur, s'exécute entièrement en local, zéro bibliothèque externe. Si le badge ⚡ affiche ✗, active l'IA intégrée dans les paramètres/flags du navigateur.","Transformers.js · WASM/WebGPU":"Exécute ONNX dans la page — même SANS WebGPU (repli sur WASM), donc ça marche sur presque tous les navigateurs. La première utilisation télécharge la bibliothèque (esm.run) et le modèle depuis HuggingFace, puis les met en cache.","LocalAI (local)":"Serveur compatible OpenAI complet (texte/image/audio) · ATTENTION : le port 8080 est aussi celui par défaut de llama.cpp — change l'un des deux si tu lances les deux · ⟳ liste la galerie installée.","Text Generation WebUI · oobabooga (local)":"Démarre avec --api (et --api-cors si nécessaire) · port par défaut 5000.","TabbyAPI · ExLlamaV2 (local)":"Inférence EXL2 rapide sur GPU · même port 5000 que oobabooga — n'en lance qu'un ou change le port.","SGLang (local/server)":"« python -m sglang.launch_server --model-path <model> » · port par défaut 30000.","MLX · Apple Silicon (local)":"« mlx_lm.server --model <model> » sur Mac M1–M4 · port par défaut 8080 (conflit avec llama.cpp/LocalAI s'ils tournent en même temps).","Aphrodite Engine (local/server)":"Moteur de service à haut débit · port par défaut 2242.","Cortex (local)":"Le moteur derrière Jan, utilisable seul (« cortex run <model> ») · port par défaut 39281.","Xinference (local/server)":"« xinference-local » · port par défaut 9997 · sert LLM/embeddings/rerank.","FastChat (local/server)":"Le serveur compatible OpenAI de l'équipe LMSYS (les créateurs de l'arène originale) · port 8000 — conflit avec vLLM si les deux tournent.","LiteLLM Proxy (local · ruter)":"Routeur local vers plus de 100 fournisseurs — tout ce que tu as configuré dans litellm apparaît ici via ⟳ · port par défaut 4000.","Docker Model Runner (local)":"« docker model run ai/<model> » depuis Docker Desktop · endpoint compatible OpenAI sur 12434 · active l'accès hôte TCP dans les paramètres Docker.","Foundry Local · Microsoft (local)":"« foundry model run <model> » — exécute localement des modèles du catalogue Foundry (Phi, Qwen, DeepSeek…) avec accélération NPU/GPU · le port est dynamique : vérifie-le avec « foundry service status » et corrige la Base URL s'il diffère.","Lemonade · AMD (local · GPU+NPU)":"Le serveur local d'AMD : LLM + Stable Diffusion + Whisper + TTS sous un seul endpoint compatible OpenAI, avec exécution hybride GPU+NPU (Ryzen AI) · vérifie le port affiché au démarrage.","Ollama · biblioteca 2026 (local)":"Les modèles open-weight les plus récents, exécutables en local via « ollama pull <id> » (Ollama lancé avec OLLAMA_ORIGINS=*) · sur Apple Silicon, Ollama utilise désormais MLX nativement · les chips supposent que le modèle est déjà téléchargé — ⚡ te le confirme.","România · OpenLLM-Ro (local)":"Les seuls LLM roumains sont open source, sans API hébergée — tu les exécutes en local : installe Ollama, puis « ollama pull hf.co/<repo> » (fonctionne si le dépôt a du GGUF ; RoLlama-3.2-1B est quantifié en 4 bits exactement pour cela ; pour les autres, cherche la conversion GGUF communautaire sur HuggingFace). IMPORTANT pour le navigateur : lance Ollama avec OLLAMA_ORIGINS=* (sinon CORS bloque la page). ⟳ liste ce que tu as déjà installé en local.","SEA-LION · Singapore (AI Singapore)":"Clé gratuite · 10 req/min · modèles souverains pour les langues d'Asie du Sud-Est.","Sarvam · India":"1000 ₹ de crédits gratuits à l'inscription, sans carte, sans expiration · 22 langues indiennes · Sarvam-30B/105B (2026) apparaissent via ⟳.","Fanar · Qatar (QCRI)":"API gratuite sur demande (formulaire développeur) · première IA générative arabe du Qatar.","AI21 · Israel":"Crédits d'essai : 10 $ / 3 mois · la famille Jamba (SSM-Transformer).","Upstage · Coreea de Sud":"Crédits d'essai : 10 $ / 3 mois · les modèles Solar.","Maritaca · Brazilia":"Crédits gratuits à l'inscription · la famille Sabiá, spécialisée en portugais.","Lume · modele naționale open-source (local)":"Modèles souverains sans API hébergée gratuite — tu les exécutes en local avec Ollama (lancé avec OLLAMA_ORIGINS=*) : « ollama pull falcon3 » ou « ollama pull hf.co/<repo> » (exige du GGUF ; sinon cherche la conversion communautaire). ⟳ liste ce que tu as installé.","Anthropic · Claude":"Payant, avec ta clé · CORS officiellement pris en charge depuis le navigateur (en-tête dédié, déjà inclus dans l'application).","OpenAI":"Payant, avec ta clé · vérifie les ID exacts avec ⟳ après avoir saisi la clé.","xAI · Grok":"Payant, avec ta clé · ⟳ pour la liste exacte.","DeepSeek (direct)":"Payant mais très bon marché — le pas le plus abordable au-delà du gratuit.","Perplexity · Sonar":"Payant, avec ta clé · modèles avec recherche web intégrée à la réponse.","LLM7.io":"Passerelle gratuite sans clé (jeton facultatif pour des limites plus élevées) · fiabilité variable — vérifie avec ⚡ et utilise ⟳ pour la vraie liste.","Together AI":"Crédits d'essai à l'inscription · grand catalogue open-weight — ⟳ après la clé.","Fireworks AI":"Crédits d'essai : 1 $ · les ID ont le préfixe accounts/fireworks/models/.","Nebius Token Factory":"Crédits d'essai : 1 $ · si l'endpoint diffère, prends-le dans la console et corrige la Base URL.","Novita AI":"Crédits d'essai : 0,5 $ valables un an.","Hyperbolic":"Crédits d'essai : 1 $.","Inference.net":"Crédits d'essai : 1 $ (25 $ avec le questionnaire par e-mail) · ⟳ pour les ID exacts.","SambaNova":"Crédits d'essai : 5 $ / 3 mois · inférence très rapide.","Scaleway":"Crédits d'essai : 1 000 000 de tokens gratuits · hébergement UE."},"groups":{"În browser · WebLLM (WebGPU)":"Dans le navigateur · WebLLM (WebGPU)","AI încorporat în browser · Gemini Nano":"IA intégrée au navigateur · Gemini Nano", er modello.","GitHub Models":"Gratuito con un Personal Access Token GitHub (scope models) · limiti per modello · include modelli proprietari.","NVIDIA NIM":"Gratuito con un account NVIDIA (verifica telefonica) · 40 req/min · contesto talvolta limitato.","Cohere":"Chiave di prova gratuita · 20 req/min, 1000 req/mese (quota condivisa).","HuggingFace Inference":"Token HF gratuito · ~0,10 $/mese di crediti Inference Providers · gli ID sono repository HF.","Cloudflare Workers AI":"10.000 neuroni/giorno gratis · IMPORTANTE: dopo l'aggiunta, modifica il modello e sostituisci CONT_ID nella Base URL con il tuo Account ID Cloudflare.","Z.ai (Zhipu)":"I modelli Flash sono gratuiti con una chiave · limiti per modello.","ModelScope · 魔搭 (Alibaba)":"Gratuito: 2000 chiamate/giorno in totale, max 500/modello (100/giorno per i grandi DeepSeek) · richiede un account Alibaba con verifica dell'identità · Qwen3.5 compare qui per primo — usa ⟳ per l'elenco completo.","SiliconFlow · 硅基流动":"Modelli piccoli gratuiti in modo permanente + ~20 M di token alla registrazione (account CN; internazionale: api.siliconflow.com, ~1 $ di credito) · l'elenco dei modelli a 0 ¥ ruota — usa ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite gratuito + ~100 M di token all'attivazione del servizio · account Tencent Cloud.","Baidu Qianfan · 百度千帆":"ERNIE Speed e Lite gratuiti · account Baidu Cloud.","iFlytek Spark · 讯飞星火":"Spark Lite gratuito e illimitato · la chiave si scrive APIKey:APISecret (con i due punti in mezzo).","Moonshot Kimi · 月之暗面":"Crediti di prova alla registrazione · endpoint CN: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Prova: 1.000.000 di token per modello, 90 giorni (endpoint Singapore).","În browser · WebLLM (WebGPU)":"L'IA gira direttamente in questa pagina, sulla tua GPU, tramite WebGPU — zero server, zero chiavi. Al primo utilizzo scarica il modello (0,6–2 GB, poi resta nella cache del browser) e la libreria WebLLM da esm.run — l'unica eccezione a «zero dipendenze», facoltativa e attiva n llama.cpp/LocalAI se girano insieme).","Aphrodite Engine (local/server)":"Motore di serving ad alto throughput · porta predefinita 2242.","Cortex (local)":"Il motore dietro Jan, utilizzabile in modo autonomo («cortex run <model>») · porta predefinita 39281.","Xinference (local/server)":"«xinference-local» · porta predefinita 9997 · serve LLM/embeddings/rerank.","FastChat (local/server)":"Il server compatibile OpenAI del team LMSYS (i creatori dell'arena originale) · porta 8000 — in conflitto con vLLM se girano entrambi.","LiteLLM Proxy (local · ruter)":"Router locale verso oltre 100 provider — tutto ciò che hai configurato in litellm compare qui tramite ⟳ · porta predefinita 4000.","Docker Model Runner (local)":"«docker model run ai/<model>» da Docker Desktop · endpoint compatibile OpenAI su 12434 · attiva l'accesso TCP host nelle impostazioni di Docker.","Foundry Local · Microsoft (local)":"«foundry model run <model>» — esegue in locale i modelli del catalogo Foundry (Phi, Qwen, DeepSeek…) con accelerazione NPU/GPU · la porta è dinamica: verificala con «foundry service status» e correggi la Base URL se diversa.","Lemonade · AMD (local · GPU+NPU)":"Il server locale di AMD: LLM + Stable Diffusion + Whisper + TTS sotto un unico endpoint compatibile OpenAI, con esecuzione ibrida GPU+NPU (Ryzen AI) · verifica la porta mostrata all'avvio.","Ollama · biblioteca 2026 (local)":"I modelli open-weight più recenti eseguibili in locale tramite «ollama pull <id>» (Ollama avviato con OLLAMA_ORIGINS=*) · su Apple Silicon Ollama ora usa MLX in modo nativo · i chip presuppongono che il modello sia già scaricato — ⚡ te lo conferma.","România · OpenLLM-Ro (local)":"Gli unici LLM rumeni sono open source, senza API ospitata — li esegui in locale: installa Ollama, poi «ollama pull hf.co/<repo>» (funziona se il repository ha GGUF; RoLlama-3.2-1B è quantizzato a 4 bit proprio per questo; per gli altri cerca la conversione GGUF della community su HuggingFace). IMPORTANTE per il browser: a · modele naționale open-source (local)":"Modelos soberanos sem API alojada gratuita — executas-os em local com o Ollama (iniciado com OLLAMA_ORIGINS=*): «ollama pull falcon3» ou «ollama pull hf.co/<repo>» (exige GGUF; caso contrário procura a conversão da comunidade). ⟳ lista o que tens instalado.","Anthropic · Claude":"Pago, com a tua chave · CORS suportado oficialmente a partir do navegador (cabeçalho dedicado, já incluído na aplicação).","OpenAI":"Pago, com a tua chave · verifica os IDs exatos com ⟳ depois de colocares a chave.","xAI · Grok":"Pago, com a tua chave · ⟳ para a lista exata.","DeepSeek (direct)":"Pago mas muito barato — o passo mais acessível além do gratuito.","Perplexity · Sonar":"Pago, com a tua chave · modelos com pesquisa web integrada na resposta.","LLM7.io":"Gateway gratuito sem chave (token opcional para limites mais altos) · fiabilidade variável — verifica com ⚡ e usa ⟳ para a lista real.","Together AI":"Créditos de teste no registo · grande catálogo open-weight — ⟳ depois da chave.","Fireworks AI":"Créditos de teste: 1 $ · os IDs têm o prefixo accounts/fireworks/models/.","Nebius Token Factory":"Créditos de teste: 1 $ · se o endpoint diferir, tira-o da consola e corrige a Base URL.","Novita AI":"Créditos de teste: 0,5 $ válidos durante um ano.","Hyperbolic":"Créditos de teste: 1 $.","Inference.net":"Créditos de teste: 1 $ (25 $ com o questionário por e-mail) · ⟳ para os IDs exatos.","SambaNova":"Créditos de teste: 5 $ / 3 meses · inferência muito rápida.","Scaleway":"Créditos de teste: 1.000.000 de tokens grátis · alojamento na UE."},"groups":{"În browser · WebLLM (WebGPU)":"No navegador · WebLLM (WebGPU)","AI încorporat în browser · Gemini Nano":"IA integrada no navegador · Gemini Nano","România · OpenLLM-Ro (local)":"Roménia · OpenLLM-Ro (local)","Lume · modele naționale open-source (local)":"Mundo · modelos nacionais de código aberto (local)"},"frag":{"în browser":"no navegador","încorporat în browser":"integrado no navegador","Modelul încărcat":"Modelo carregado","Modelul servit":"Modelo servido","Modelul lansat":"Modelo iniciado","Modelul rulat":"Modelo em execução","Modelele găzduite":"Modelos alojados","Arabia Saudită":"Arábia Saudita","România":"Roménia"}},"de":{"notes":{"Pollinations":"Die alte API (text.pollinations.ai) wurde eingestellt und liefert 402 — die neue verlangt einen KOSTENLOSEN Schlüssel von enter.pollinations.ai: verwende einen pk_-Schlüssel (publishable), der ausdrücklich für den sicheren Einsatz im Browser gedacht ist · kostenloses Kontingent mit regelmäßig aufgefülltem Pollen · ⟳ funktioniert auch ohne Schlüssel (der Katalog ist öffentlich).","Kilo Gateway":"Die :free-Modelle funktionieren ohne Konto · 200 Anfragen/Stunde pro IP · Prompts können für Training verwendet werden · wenn du „Netzwerk/CORS blockiert“ erhältst, lehnt das Gateway Browser-Aufrufe aus deinem Netzwerk ab — leite es über einen lokalen LiteLLM-Proxy.","OpenCode Zen":"Kostenloser Schlüssel, ohne Karte · kostenlose, für Coding ausgewählte Modelle · Daten aus der kostenlosen Phase können zur Verbesserung der Modelle verwendet werden.","OpenRouter":"Kostenloser Schlüssel, ohne Karte · 20 Anfragen/Min., 50 Anfragen/Tag (1000/Tag nach einer einmaligen Aufladung von 10 $) · die :free-Modelle wechseln häufig.","Groq":"Free Tier, ohne Karte · sehr schnell (LPU) · ~1000 Anfragen/Tag bei den großen Modellen (Limits 2026 gesenkt).","Cerebras":"Free Tier · schnellster Durchsatz (~2000 Tok/s) · ~1 Mio. Tokens/Tag pro Modell.","Google AI Studio":"Free Tier · Gemini Flash ~20 Anfragen/Tag, Flash-Lite ~500/Tag, Gemma ~14400/Tag · außerhalb der EU können Daten für Training genutzt werden · prüfe die genauen IDs in AI Studio.","Mistral La Plateforme":"Free Tier (Experiment) · erfordert Telefonverifizierung und Zustimmung zum Training mit Daten · großzügige Limits pro Modell.","GitHub Models":"Kostenlos mit einem GitHub Personal Access Token (Scope models) · Limits pro Modell · enthält proprietäre Modelle.","NVIDIA NIM":"Kostenlos mit einem NVIDIA-Konto (Telefonverifizierung) · 40 Anfragen/Min. · Kontext teils begrenzt.","Cohere":"Kostenloser Testschlüssel · 20 Anfragen/Min., 1000 Anfragen/Monat (gemeinsames Kontingent).","HuggingFace Inference":"Kostenloses HF-Token · ~0,10 $/Monat an Inference-Providers-Guthaben · die IDs sind HF-Repos.","Cloudflare Workers AI":"10.000 Neuronen/Tag kostenlos · WICHTIG: Bearbeite das Modell nach dem Hinzufügen und ersetze CONT_ID in der Base URL durch deine Cloudflare-Account-ID.","Z.ai (Zhipu)":"Die Flash-Modelle sind mit Schlüssel kostenlos · Limits pro Modell.","ModelScope · 魔搭 (Alibaba)":"Kostenlos: 2000 Aufrufe/Tag insgesamt, max. 500/Modell (100/Tag bei den großen DeepSeek-Modellen) · erfordert ein Alibaba-Konto mit Identitätsprüfung · Qwen3.5 erscheint hier zuerst — nutze ⟳ für die vollständige Liste.","SiliconFlow · 硅基流动":"Kleine Modelle dauerhaft kostenlos + ~20 Mio. Tokens bei der Registrierung (CN-Konto; international: api.siliconflow.com, ~1 $ Guthaben) · die Liste der 0-¥-Modelle wechselt — nutze ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite kostenlos + ~100 Mio. Tokens bei Aktivierung des Dienstes · Tencent-Cloud-Konto.","Baidu Qianfan · 百度千帆":"ERNIE Speed und Lite kostenlos · Baidu-Cloud-Konto.","iFlytek Spark · 讯飞星火":"Spark Lite kostenlos und unbegrenzt · der Schlüssel wird als APIKey:APISecret geschrieben (mit Doppelpunkt dazwischen).","Moonshot Kimi · 月之暗面":"Testguthaben bei der Registrierung · CN-Endpunkt: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Test: 1.000.000 Tokens pro Modell, 90 Tage (Singapur-Endpunkt).","În browser · WebLLM (WebGPU)":"Die KI läuft direkt in dieser Seite, auf deiner GPU, über WebGPU — null Server, null Schlüssel. Bei der ersten Nutzung lädt sie das Modell (0,6–2 GB, danach bleibt es im Browser-Cache) und die WebLLM-Bibliothek von esm.run herunter — die einzige Ausnahme von „null Abhängigkeiten“, optional und nur von dir ausgelöst.","LM Studio (local)":"Starte den Server im Tab Developer und aktiviere CORS in den Servereinstellungen · ⟳ listet die geladenen Modelle auf — nutze es, die statische ID unten ist nur ein Anhaltspunkt.","Jan (local)":"Aktiviere den API Server in den Jan-Einstellungen (mit CORS) · ⟳ listet die installierten Modelle auf.","llama.cpp / llamafile (local)":"„llama-server -m model.gguf“ oder Doppelklick auf ein llamafile · der Server akzeptiert jede Modell-ID · CORS ist standardmäßig erlaubt.","GPT4All (local)":"Aktiviere „Local API Server“ unter Settings · ⟳ listet die Modelle auf.","KoboldCpp (local)":"OpenAI-kompatibler Endpunkt, standardmäßig aktiv auf Port 5001.","vLLM (local/server)":"„vllm serve <model>“ · für den Zugriff aus dem Browser mit --allowed-origins '[\"*\"]' starten.","AI încorporat în browser · Gemini Nano":"Prompt API in Chrome/Edge — das Modell wird vom Browser verwaltet und nur einmal heruntergeladen, läuft vollständig lokal, null externe Bibliotheken. Zeigt das Badge ⚡ ein ✗, aktiviere die integrierte KI in den Browsereinstellungen/Flags.","Transformers.js · WASM/WebGPU":"Führt ONNX in der Seite aus — auch OHNE WebGPU (Rückfall auf WASM), läuft also in fast jedem Browser. Bei der ersten Nutzung werden die Bibliothek (esm.run) und das Modell von HuggingFace geladen und dann zwischengespeichert.","LocalAI (local)":"Vollständiger OpenAI-kompatibler Server (Text/Bild/Audio) · ACHTUNG: Port 8080 ist auch der Standard von llama.cpp — ändere einen der beiden, wenn du beide betreibst · ⟳ listet die installierte Galerie auf.","Text Generation WebUI · oobabooga (local)":"Mit --api starten (und --api-cors, falls nötig) · Standardport 5000.","TabbyAPI · ExLlamaV2 (local)":"Schnelle EXL2-Inferenz auf der GPU · derselbe Port 5000 wie oobabooga — betreibe nur einen oder ändere den Port.","SGLang (local/server)":"„python -m sglang.launch_server --model-path <model>“ · Standardport 30000.","MLX · Apple Silicon (local)":"„mlx_lm.server --model <model>“ auf Mac M1–M4 · Standardport 8080 (Konflikt mit llama.cpp/LocalAI, wenn sie gleichzeitig laufen).","Aphrodite Engine (local/server)":"Serving-Engine mit hohem Durchsatz · Standardport 2242.","Cortex (local)":"Die Engine hinter Jan, auch eigenständig nutzbar („cortex run <model>“) · Standardport 39281.","Xinference (local/server)":"„xinference-local“ · Standardport 9997 · bedient LLM/Embeddings/Rerank.","FastChat (local/server)":"Der OpenAI-kompatible Server des LMSYS-Teams (der Macher der ursprünglichen Arena) · Port 8000 — Konflikt mit vLLM, wenn beide laufen.","LiteLLM Proxy (local · ruter)":"Lokaler Router zu über 100 Anbietern — alles, was du in litellm konfiguriert hast, erscheint hier über ⟳ · Standardport 4000.","Docker Model Runner (local)":"„docker model run ai/<model>“ aus Docker Desktop · OpenAI-kompatibler Endpunkt auf 12434 · aktiviere TCP-Host-Zugriff in den Docker-Einstellungen.","Foundry Local · Microsoft (local)":"„foundry model run <model>“ — führt Modelle aus dem Foundry-Katalog (Phi, Qwen, DeepSeek…) lokal mit NPU/GPU-Beschleunigung aus · der Port ist dynamisch: prüfe ihn mit „foundry service status“ und korrigiere die Base URL, falls er abweicht.","Lemonade · AMD (local · GPU+NPU)":"Der lokale AMD-Server: LLM + Stable Diffusion + Whisper + TTS unter einem einzigen OpenAI-kompatiblen Endpunkt, mit hybrider GPU+NPU-Ausführung (Ryzen AI) · prüfe den beim Start angezeigten Port.","Ollama · biblioteca 2026 (local)":"Die neuesten Open-Weight-Modelle, lokal ausführbar über „ollama pull <id>“ (Ollama mit OLLAMA_ORIGINS=* gestartet) · auf Apple Silicon nutzt Ollama jetzt nativ MLX · die Chips gehen davon aus, dass das Modell bereits geladen ist — ⚡ bestätigt es dir.","România · OpenLLM-Ro (local)":"Die einzigen rumänischen LLMs sind Open Source, ohne gehostete API — du führst sie lokal aus: installiere Ollama, dann „ollama pull hf.co/<repo>“ (funktioniert, wenn das Repo GGUF hat; RoLlama-3.2-1B ist genau dafür 4-Bit-quantisiert; für die anderen such die GGUF-Konvertierung der Community auf HuggingFace). WICHTIG für den Browser: Starte Ollama mit OLLAMA_ORIGINS=* (sonst blockiert CORS die Seite). ⟳ listet auf, was du lokal schon installiert hast.","SEA-LION · Singapore (AI Singapore)":"Kostenloser Schlüssel · 10 Anfragen/Min. · souveräne Modelle für südostasiatische Sprachen.","Sarvam · India":"1000 ₹ Gratisguthaben bei der Registrierung, ohne Karte, ohne Ablauf · 22 indische Sprachen · Sarvam-30B/105B (2026) erscheinen über ⟳.","Fanar · Qatar (QCRI)":"Kostenlose API auf Anfrage (Entwicklerformular) · die erste arabische generative KI Katars.","AI21 · Israel":"Testguthaben: 10 $ / 3 Monate · die Jamba-Familie (SSM-Transformer).","Upstage · Coreea de Sud":"Testguthaben: 10 $ / 3 Monate · die Solar-Modelle.","Maritaca · Brazilia":"Gratisguthaben bei der Registrierung · die Sabiá-Familie, spezialisiert auf Portugiesisch.","Lume · modele naționale open-source (local)":"Souveräne Modelle ohne kostenlose gehostete API — du führst sie lokal mit Ollama aus (mit OLLAMA_ORIGINS=* gestartet): „ollama pull falcon3“ oder „ollama pull hf.co/<repo>“ (verlangt GGUF; sonst such die Community-Konvertierung). ⟳ listet auf, was du installiert hast.","Anthropic · Claude":"Kostenpflichtig, mit deinem Schlüssel · CORS wird offiziell aus dem Browser unterstützt (eigener Header, bereits in der App enthalten).","OpenAI":"Kostenpflichtig, mit deinem Schlüssel · prüfe die genauen IDs mit ⟳, nachdem du den Schlüssel eingetragen hast.","xAI · Grok":"Kostenpflichtig, mit deinem Schlüssel · ⟳ für die genaue Liste.","DeepSeek (direct)":"Kostenpflichtig, aber sehr günstig — der erschwinglichste Schritt über das Kostenlose hinaus.","Perplexity · Sonar":"Kostenpflichtig, mit deinem Schlüssel · Modelle mit in die Antwort integrierter Websuche.","LLM7.io":"Kostenloses Gateway ohne Schlüssel (optionales Token für höhere Limits) · schwankende Zuverlässigkeit — prüfe mit ⚡ und nutze ⟳ für die echte Liste.","Together AI":"Testguthaben bei der Registrierung · großer Open-Weight-Katalog — ⟳ nach dem Schlüssel.","Fireworks AI":"Testguthaben: 1 $ · die IDs tragen das Präfix accounts/fireworks/models/.","Nebius Token Factory":"Testguthaben: 1 $ · weicht der Endpunkt ab, übernimm ihn aus der Konsole und korrigiere die Base URL.","Novita AI":"Testguthaben: 0,5 $, ein Jahr gültig.","Hyperbolic":"Testguthaben: 1 $.","Inference.net":"Testguthaben: 1 $ (25 $ mit dem E-Mail-Fragebogen) · ⟳ für die genauen IDs.","SambaNova":"Testguthaben: 5 $ / 3 Monate · sehr schnelle Inferenz.","Scaleway":"Testguthaben: 1.000.000 Tokens kostenlos · Hosting in der EU."},"groups":{"În browser · WebLLM (WebGPU)":"Im Browser · WebLLM (WebGPU)","AI încorporat în browser · Gemini Nano":"Im Browser integrierte KI · Gemini Nano","România · OpenLLM-Ro (local)":"Rumänien · OpenLLM-Ro (lokal)","Lume · modele naționale open-source (local)":"Welt · nationale Open-Source-Modelle (lokal)"},"frag":{"în browser":"im Browser","încorporat în browser":"im Browser integriert","Modelul încărcat":"Geladenes Modell","Modelul servit":"Bereitgestelltes Modell","Modelul lansat":"Gestartetes Modell","Modelul rulat":"Laufendes Modell","Modelele găzduite":"Gehostete Modelle","Arabia Saudită":"Saudi-Arabien","România":"Rumänien"}},"hu":{"notes":{"Pollinations":"A régi API (text.pollinations.ai) elavult és 402-t ad — az új INGYENES kulcsot kér az enter.pollinations.ai oldalról: használj pk_ (publishable) kulcsot, amelyet kifejezetten a böngészőben való biztonságos használatra terveztek · ingyenes szint rendszeresen újratöltődő Pollennel · a ⟳ kulcs nélkül is működik (a katalógus nyilvános).","Kilo Gateway":"A :free modellek fiók nélkül működnek · 200 kérés/óra IP-nként · a promptok felhasználhatók tanításra · ha „hálózat/CORS letiltva” hibát kapsz, az átjáró elutasítja a böngészőből érkező hívásokat a hálózatodról — irányítsd át egy helyi LiteLLM Proxyn.","OpenCode Zen":"Ingyenes kulcs, kártya nélkül · kódoláshoz válogatott ingyenes modellek · az ingyenes időszak adatai felhasználhatók a modellek fejlesztésére.","OpenRouter":"Ingyenes kulcs, kártya nélkül · 20 kér function gNameL(g){const c=CAT_I18N[LANG];return (c&&c.groups[g.g])||g.g;}
function noteL(g){const c=CAT_I18N[LANG];return (c&&c.notes[g.g])||g.note;}
function nNameL(n){const c=CAT_I18N[LANG];if(!c)return n;
  if(!c._re){const ks=Object.keys(c.frag).sort((a,b)=>b.length-a.length);c._re=new RegExp(ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");}
  return n.replace(c._re,m=>c.frag[m]);}


/* ---------------- state & storage ---------------- */
const SKEY="arena-ff-v1";
/* copia de siguranță necriptată din kit (FFF.bundle.export fără parolă) nu poartă cheile API; cea criptată le păstrează */
if(window.FFF&&FFF.bundle&&FFF.bundle.redact)FFF.bundle.redact(function(k,v){
  if(k!==SKEY)return v;
  try{const o=JSON.parse(v);if(o&&Array.isArray(o.models))o.models.forEach(m=>{if(m&&m.apiKey)m.apiKey="";});return JSON.stringify(o);}catch(e){return "";}
});
let memStore=null, storageOK=true;
/* sanitizare: starea vine din localStorage sau dintr-un fișier importat (neîncredere) — valorile ajung în innerHTML */
function sanitizeState(j){
  if(!j||typeof j!=="object"||!Array.isArray(j.models))return null;
  const num=(v,d)=>{v=Number(v);return Number.isFinite(v)?v:d;};
  const str=v=>v==null?"":String(v);
  const PROVS=["openai","pollinations","browser","chromeai","transformersjs","anthropic","ollama","demo"];
  const o={lang:LANGS.includes(j.lang)?j.lang:"ro",models:[],ratings:{},history:[],keysSession:!!j.keysSession};
  if(j.cat26!=null)o.cat26=num(j.cat26,0);
  if(j.cat26v4!=null)o.cat26v4=num(j.cat26v4,0);
  const seen=new Set();
  for(const m of j.models){
    if(!m||typeof m!=="object")continue;
    const id=str(m.id);if(!id||seen.has(id))continue;
    const provider=PROVS.includes(m.provider)?m.provider:"openai";
    if(provider==="demo"&&!DEMO_STYLES[m.style])continue;
    seen.add(id);
    const c={id,name:str(m.name)||id,provider,model:str(m.model),baseUrl:str(m.baseUrl),apiKey:str(m.apiKey),enabled:!!m.enabled,demo:provider==="demo"};
    if(provider==="demo")c.style=m.style;
    const lt=m.lastTest;
    if(lt&&typeof lt==="object")c.lastTest={ok:!!lt.ok,ms:num(lt.ms,0),code:str(lt.code),ts:num(lt.ts,0)};
    o.models.push(c);
  }
  if(j.ratings&&typeof j.ratings==="object")for(const k of Object.keys(j.ratings)){
    const r=j.ratings[k];if(k==="__proto__"||!r||typeof r!=="object")continue;
    o.ratings[k]={elo:num(r.elo,1000),w:num(r.w,0),d:num(r.d,0),l:num(r.l,0),m:num(r.m,0)};
  }
  if(Array.isArray(j.history))o.history=j.history.slice(-500).filter(h=>h&&typeof h==="object").map(h=>({ts:num(h.ts,0),a:str(h.a),b:str(h.b),s:num(h.s,0.5),p:str(h.p).slice(0,140)}));
  return o;
}
function loadState(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(raw){
      const st=sanitizeState(JSON.parse(raw));
      if(st&&st.keysSession){ /* cheile trăiesc doar în sessionStorage (dispar la închiderea filei) */
        try{const k=JSON.parse(sessionStorage.getItem(SKEY+"-keys")||"{}");st.models.forEach(m=>{if(!m.apiKey&&typeof k[m.id]==="string")m.apiKey=k[m.id];});}catch(e){}
      }
      return st;
    }
  }
  catch(e){storageOK=false;}
  return null;
}
function saveState(){
  let disk=S;
  if(S.keysSession){
    const keys={}; S.models.forEach(m=>{if(m.apiKey)keys[m.id]=m.apiKey;});
    try{sessionStorage.setItem(SKEY+"-keys",JSON.stringify(keys));}catch(e){}
    disk=Object.assign({},S,{models:S.models.map(m=>Object.assign({},m,{apiKey:""}))});
  } else { try{sessionStorage.removeItem(SKEY+"-keys");}catch(e){} }
  const data=JSON.stringify(disk);
  try{localStorage.setItem(SKEY,data);}
  catch(e){storageOK=false;memStore=data;}
}

/* ---------------- streaming: demo ---------------- */
async function* demoStream(model,prompt,signal){
  const st=DEMO_STYLES[model.style][LANG]||DEMO_STYLES[model.style].en;
  const DW=DEMO_WRAP[LANG]||DEMO_WRAP.en;
  const seed=hash(prompt+"|"+model.id);
  const topic=prompt.trim().split(/\s+/).slice(0,7).join(" ");
  const parts=[pick(st.open,seed)+" ",
    DW[0]+topic+DW[1],
    pick(st.mid,seed>>>3)+" ",
    pick(st.mid,(seed>>>7)+1)+"\n\n",
    pick(st.close,seed>>>11)];
  parts.push(DW[2]);
  const text=parts.join("");
  const words=text.split(/(\s+)/);
  for(const w of words){
    if(signal.aborted)return;
    yield w;
    await new Promise(r=>setTimeout(r,12+ (hash(w)%28)));
  }
}

/* ---------------- streaming: real providers ---------------- */
async function* sseLines(resp,signal){
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf="";
  while(true){
    if(signal.aborted){reader.cancel();return;}
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(line.startsWith("data:"))yield line.slice(5).trim();
    }
  }
}
async function* openaiStream(model,prompt,signal){
  const url=(model.baseUrl||"https://api.openai.com/v1").replace(/\/+$/,"")+"/chat/completions";
  const headers={"Content-Type":"application/json"};
  if(model.apiKey)headers["Authorization"]="Bearer "+model.apiKey;
  const resp=await fetch(url,{method:"POST",headers,signal,
    body:JSON.stringify({model:model.model,stream:true,messages:[{role:"user",content:prompt}]})});
  if(!resp.ok)throw new Error(resp.status+" "+(await resp.text()).slice(0,200));
  for await(const d of sseLines(resp,signal)){
    if(d==="[DONE]")return;
    let j;try{j=JSON.parse(d);}catch(e){continue;}
    if(j&&j.error)throw new Error(String(j.error.message||JSON.stringify(j.error)).slice(0,200));
    const c=j?.choices?.[0]?.delta?.content;if(c)yield c;
  }
}
async function* anthropicStream(model,prompt,signal){
  const url=(model.baseUrl||"https://api.anthropic.com").replace(/\/+$/,"")+"/v1/messages";
  const resp=await fetch(url,{method:"POST",signal,
    headers:{"Content-Type":"application/json","x-api-key":model.apiKey||"",
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:model.model,max_tokens:2048,stream:true,messages:[{role:"user",content:prompt}]})});
  if(!resp.ok)throw new Error(resp.status+" "+(await resp.text()).slice(0,200));
  for await(const d of sseLines(resp,signal)){
    let j;try{j=JSON.parse(d);}catch(e){continue;}
    if(j&&j.type==="error")throw new Error(String(j.error?.message||"stream error").slice(0,200));
    if(j&&j.type==="content_block_delta"&&j.delta?.text)yield j.delta.text;
  }
}
/* ---------------- WebLLM: AI local în browser (WebGPU) ---------------- */
const WLLM={mod:null,engines:{}};
async function* webllmStream(model,prompt,signal){
  if(!navigator.gpu)throw new Error("WebGPU indisponibil — folosește Chrome/Edge recent");
  if(!WLLM.mod)WLLM.mod=await import("https://esm.run/@mlc-ai/web-llm@0.2.84");
  let eng=WLLM.engines[model.model];
  if(!eng){
    const el=model._progressEl;
    eng=await WLLM.mod.CreateMLCEngine(model.model,{initProgressCallback:p=>{if(el)el.textContent="⬇ "+p.text;}});
    WLLM.engines[model.model]=eng;
    if(el)el.textContent="";
  }
  const chunks=await eng.chat.completions.create({stream:true,messages:[{role:"user",content:prompt}]});
  for await(const c of chunks){
    if(signal.aborted)return;
    const d=c.choices?.[0]?.delta?.content;
    if(d)yield d;
  }
}

/* ---------------- AI încorporat în browser (Prompt API · Gemini Nano) ---------------- */
async function* chromeAIStream(model,prompt,signal){
  const LM=(typeof LanguageModel!=="undefined"?LanguageModel:null)||(typeof window!=="undefined"&&window.ai&&window.ai.languageModel);
  if(!LM)throw new Error("Prompt API indisponibil — cere Chrome/Edge recent cu AI încorporat");
  /* sesiunile Prompt API sunt statefule — una nouă per duel, altfel contextul se scurge între dueluri */
  const session=await LM.create();
  try{
    const stream=session.promptStreaming(prompt);
    let prev="";
    for await(const chunk of stream){
      if(signal.aborted)return;
      /* API veche livrează text cumulat, cea nouă delte — le tratez pe ambele */
      if(chunk.startsWith(prev)){yield chunk.slice(prev.length);prev=chunk;}
      else{yield chunk;prev+=chunk;}
    }
  }finally{if(session.destroy)session.destroy();}
}

/* ---------------- Transformers.js (WASM/WebGPU) — merge și fără WebGPU ---------------- */
const TJS={mod:null,pipes:{}};
async function* tjsStream(model,prompt,signal){
  if(!TJS.mod)TJS.mod=await import("https://esm.run/@huggingface/transformers@4.2.0");
  let pipe=TJS.pipes[model.model];
  if(!pipe){
    const el=model._progressEl;
    pipe=await TJS.mod.pipeline("text-generation",model.model,{
      dtype:"q4",device:(typeof navigator!=="undefined"&&navigator.gpu)?"webgpu":"wasm",
      progress_callback:p=>{if(el&&p.status==="progress")el.textContent="⬇ "+(p.file||"")+" "+Math.round(p.progress||0)+"%";}});
    TJS.pipes[model.model]=pipe;
    if(el)el.textContent="";
  }
  const q=[];let done=false,err=null,wake=null;
  const streamer=new TJS.mod.TextStreamer(pipe.tokenizer,{skip_prompt:true,skip_special_tokens:true,
    callback_function:t=>{q.push(t);if(wake)wake();}});
  pipe([{role:"user",content:prompt}],{max_new_tokens:512,streamer})
    .then(()=>{done=true;if(wake)wake();})
    .catch(e=>{err=e;done=true;if(wake)wake();});
  while(!done||q.length){
    if(signal.aborted)return;
    if(q.length)yield q.shift();
    else await new Promise(r=>{wake=r;setTimeout(r,60);});
  }
  if(err)throw err;
}
function streamFor(model,prompt,signal){
  if(model.provider==="browser")return webllmStream(model,prompt,signal);
  if(model.provider==="chromeai")return chromeAIStream(model,prompt,signal);
  if(model.provider==="transformersjs")return tjsStream(model,prompt,signal);
  if(model.provider==="demo")return demoStream(model,prompt,signal);
  if(model.provider==="anthropic")return anthropicStream(model,prompt,signal);
  // openai + pollinations + ollama share the OpenAI-compatible schema
  let m=model;
  if(model.provider==="ollama"&&!model.baseUrl)m={...model,baseUrl:"http://localhost:11434/v1"};
  if(model.provider==="pollinations"&&!model.baseUrl)m={...model,baseUrl:"https://gen.pollinations.ai/v1"};
  return openaiStream(m,prompt,signal);
}
async function runInto(model,prompt,el,signal){
  el.textContent="";el.classList.remove("err");el.classList.add("cursor");
  if(model.provider==="browser"||model.provider==="transformersjs")Object.defineProperty(model,"_progressEl",{value:el,writable:true,configurable:true,enumerable:false});
  try{
    for await(const chunk of streamFor(model,prompt,signal)){
      el.textContent+=chunk;
    }
    return true;
  }catch(e){
    if(signal.aborted)return true;
    let msg=String(e.message||e);
    if(/failed to fetch|networkerror|load failed/i.test(msg))msg=t("err_cors");
    if(msg.length>180)msg=msg.slice(0,180)+"…";
    el.classList.add("err");el.textContent=t("err_stream")+msg;
    /* badge automat: duelul eșuat devine ✗ vizibil în lista de combatanți */
    const real=S.models.find(x=>x.id===model.id);
    if(real){
      const code=(String(e.message||"").match(/^(\d{3})/)||[])[1]||"rețea/CORS";
      real.lastTest={ok:false,ms:0,code,ts:Date.now()};
      saveState();
    }
    return false;
  }finally{el.classList.remove("cursor");}
}

async function pingModel(m){
  if(m.provider==="demo")return{ok:true,ms:0};
  if(m.provider==="browser")return navigator.gpu?{ok:true,ms:0}:{ok:false,ms:0,code:"WebGPU"};
  if(m.provider==="chromeai"){const LM=(typeof LanguageModel!=="undefined")||(typeof window!=="undefined"&&window.ai&&window.ai.languageModel);return LM?{ok:true,ms:0}:{ok:false,ms:0,code:"Prompt API"};}
  if(m.provider==="transformersjs")return{ok:true,ms:0};
  const t0=performance.now();
  try{
    let url,opts;
    const msg=[{role:"user",content:"ping"}];
    if(m.provider==="anthropic"){
      url=(m.baseUrl||"https://api.anthropic.com").replace(/\/+$/,"")+"/v1/messages";
      opts={method:"POST",headers:{"Content-Type":"application/json","x-api-key":m.apiKey||"",
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:m.model,max_tokens:1,messages:msg})};
    }else{
      let base=m.baseUrl||(m.provider==="openai"?"https://api.openai.com/v1":"");
      if(m.provider==="ollama"&&!base)base="http://localhost:11434/v1";
      if(m.provider==="pollinations"&&!base)base="https://gen.pollinations.ai/v1";
      url=base.replace(/\/+$/,"")+"/chat/completions";
      const h={"Content-Type":"application/json"};
      if(m.apiKey)h["Authorization"]="Bearer "+m.apiKey;
      opts={method:"POST",headers:h,body:JSON.stringify({model:m.model,max_tokens:1,messages:msg})};
    }
    if(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)opts.signal=AbortSignal.timeout(20000);
    let r=await fetch(url,opts);
    if(r.status===400&&m.provider!=="anthropic"){
      const b=JSON.parse(opts.body);delete b.max_tokens;b.max_completion_tokens=16;
      r=await fetch(url,{...opts,body:JSON.stringify(b)});
    }
    const ms=Math.round(performance.now()-t0);
    return r.ok?{ok:true,ms}:{ok:false,ms,code:r.status};
  }catch(e){return{ok:false,ms:Math.round(performance.now()-t0),code:e.name==="TimeoutError"?"timeout":"rețea"};}
}

/* ---------------- Elo ---------------- */
function eloUpdate(idA,idB,scoreA){ // scoreA: 1 / 0.5 / 0
  const A=rating(idA),B=rating(idB);
  const expA=1/(1+Math.pow(10,(B.elo-A.elo)/400));
  const K=32;
  const dA=Math.round(K*(scoreA-expA));
  A.elo+=dA;B.elo-=dA;
  A.m++;B.m++;
  if(scoreA===1){A.w++;B.l++;}else if(scoreA===0){A.l++;B.w++;}else{A.d++;B.d++;}
  return dA;
}

let duel=null; // {a,b,prompt,ctrl,done}
function setVote(on){["v-a","v-b","v-tie","v-bad"].forEach(id=>$(id).disabled=!on);}
function resetDuelUI(){
  $("d-pa").textContent="";$("d-pb").textContent="";
  $("d-ra").textContent="";$("d-rb").textContent="";
  $("d-da").textContent="";$("d-db").textContent="";

  $("d-wa").textContent="⚔ A";$("d-wb").textContent="⚔ B";

  setVote(false);

async function startDuel(){
  const prompt=$("d-prompt").value.trim();
  if(!prompt){toast(t("need_prompt"));return;}
  const pool=enabledModels();
  if(pool.length<2){toast(t("need2"));return;}
  if(duel?.ctrl)duel.ctrl.abort();
  resetDuelUI();
  const i=Math.floor(Math.random()*pool.length);
  let j=Math.floor(Math.random()*(pool.length-1));if(j>=i)j++;
  const ctrl=new AbortController();
  duel={a:pool[i],b:pool[j],prompt,ctrl,done:false};
  const mine=duel;
  $("d-go").disabled=true;$("d-stop").style.display="";
  const [okA,okB]=await Promise.all([
    runInto(duel.a,prompt,$("d-pa"),ctrl.signal),
    runInto(duel.b,prompt,$("d-pb"),ctrl.signal)
  ]);
  if(duel!==mine)return; /* între timp a pornit alt duel (Stop + duel nou): nu atingem UI-ul lui */
  $("d-go").disabled=false;$("d-stop").style.display="none";
  if(ctrl.signal.aborted){resetDuelUI();duel=null;return;}
  if(!(okA&&okB)){
    $("d-verdict").textContent=t("verdict_err");$("d-verdict").classList.add("on");
    $("d-post").classList.add("on");
    duel=null;return;
  }
  duel.done=true;
  setVote(true);
}
function reveal(scoreA,verdictKey){
  if(!duel||!duel.done)return;
  setVote(false);
  const dA=eloUpdate(duel.a.id,duel.b.id,scoreA);
  S.history.push({ts:Date.now(),a:duel.a.id,b:duel.b.id,s:scoreA,p:duel.prompt.slice(0,140)});
  if(S.history.length>500)S.history=S.history.slice(-500);
  saveState();
  $("d-wa").textContent=duel.a.name;$("d-wb").textContent=duel.b.name;
  $("d-ra").textContent=t("was")+" A";$("d-rb").textContent=t("was")+" B";
  const da=$("d-da"),db=$("d-db");
  da.textContent=(dA>=0?"+":"")+dA+" Elo";db.textContent=(dA<=0?"+":"")+(-dA)+" Elo";
  da.className="delta "+(dA>0?"up":dA<0?"down":"");
  db.className="delta "+(dA<0?"up":dA>0?"down":"");
  $("d-verdict").textContent=t(verdictKey);$("d-verdict").classList.add("on");
  $("d-post").classList.add("on");
}

    url=base+"/v1/models";
    headers={"x-api-key":key||"","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  }else if(key)headers["Authorization"]="Bearer "+key;
  const resp=await fetch(url,{headers,signal:(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)?AbortSignal.timeout(20000):undefined});
  if(!resp.ok)throw new Error(resp.status+"");
  const j=await resp.json();
  const arr=Array.isArray(j)?j:(j.data||j.models||[]);
  let n=0;
  for(const m of arr){
    if(n>=SYNC_CAP)break;
    const id=typeof m==="string"?m:(m.id||m.name);
    if(!id)continue;
    const mm=typeof m==="string"?{id}:m;
    if(!isFreeModel(g,mm))continue;
    if(addFromCat(g,{id,n:(mm.name&&mm.name!==id?mm.name:id)+" · "+gNameL(g)},key))n++;
  }
  return n;
}

function storedKeyFor(g){const m=S.models.find(x=>x.baseUrl===g.baseUrl&&x.apiKey);return m?m.apiKey:"";}
async function syncAll(){
  const btn=$("sync-all");btn.disabled=true;
  let total=0,done=0,skipped=[];
  for(const g of FREE_2026){
    const key=g.needKey?storedKeyFor(g):"";
    if(g.needKey&&!key){skipped.push(g.g);continue;}
    try{total+=await syncGroup(g,key);done++;}catch(e){skipped.push(g.g);}
  }
  if(total){saveState();renderModels();renderCatalog();fillCmpSelects();}
  toast(total+" "+t("cat_added")+" ("+done+" "+t("sync_groups")+(skipped.length?", "+t("sync_skipped")+" "+skipped.length:"")+")");
  btn.disabled=false;
}

/* ---------------- free catalog UI ---------------- */
/* categorii calculate + regiuni pe grup */
function catOf(g){
  if(g.provider==="browser"||g.provider==="chromeai"||g.provider==="transformersjs")return"browser";
  if(g.baseUrl&&g.baseUrl.includes("localhost"))return"local";
  if(g.paid)return"paid";
  if(g.trial)return"trial";
  if(!g.needKey)return"keyless";
  return"free";
}
const REGIONS={"ModelScope":"china","SiliconFlow":"china","Tencent":"china","Baidu":"china","iFlytek":"china","Moonshot":"china","Alibaba":"china","Z.ai":"china","DeepSeek (direct)":"china",
"Mistral":"europa","Scaleway":"europa","România":"românia","SEA-LION":"asia","Sarvam":"asia","Upstage":"asia","Fanar":"orient","AI21":"orient","Maritaca":"americi","Cohere":"americi"};
function regOf(g){for(const k in REGIONS)if(g.g.startsWith(k)||g.g.includes(k))return REGIONS[k];return"global";}
const FILT={cat:"all",reg:"all",q:""};
const GK={}; /* cheile tastate per grup — persistă peste re-randări */
function groupVisible(g){
  if(FILT.cat!=="all"&&catOf(g)!==FILT.cat)return false;
  if(FILT.reg!=="all"&&regOf(g)!==FILT.reg)return false;
  if(FILT.q){
    const q=FILT.q.toLowerCase();
    if(!g.g.toLowerCase().includes(q)&&!g.models.some(pm=>(pm.n+" "+pm.id).toLowerCase().includes(q)))return false;
  }
  return true;
}
function renderFilterBar(){
  const cats=["all","keyless","free","trial","paid","local","browser"];
  $("f-cats").innerHTML=cats.map(c=>`<button class="fchip ${FILT.cat===c?"on":""}" data-fc="${c}">${t("f_"+c)}</button>`).join(" ");
  const regs=["all","global","china","europa","românia","asia","orient","americi"];
  $("f-reg").innerHTML=regs.map(r=>`<option value="${r}" ${FILT.reg===r?"selected":""}>${t("r_"+r)}</option>`).join("");
}
function codeL(c){c=String(c);return c==="rețea"?t("code_net"):c==="rețea/CORS"?t("code_netcors"):c==="cheie pk_"?t("code_pk"):c;}
function inList(g,pm){return S.models.some(m=>m.baseUrl===g.baseUrl&&m.model===pm.id);}
function addFromCat(g,pm,key){
  if(inList(g,pm))return false;
  S.models.push({id:"cat-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6),
    name:nNameL(pm.n),provider:g.provider,model:pm.id,baseUrl:g.baseUrl,
    apiKey:key||"",enabled:true,demo:false});
  return true;
}
function renderCatalog(){
  renderFilterBar();
  const box=$("catlist");box.innerHTML="";
  const vis=FREE_2026.filter(groupVisible);
  const q=FILT.q.toLowerCase();
  $("f-count").textContent=vis.length+" / "+FREE_2026.length+" "+t("f_prov")+" · "+
    vis.reduce((s,g)=>s+g.models.filter(pm=>!q||(pm.n+" "+pm.id).toLowerCase().includes(q)||g.g.toLowerCase().includes(q)).length,0)+" "+t("f_mod");
  vis.forEach((g,gi)=>{
    const card=document.createElement("div");card.className="gcard";
    const kh=(g.needKey
      ?`<div class="gk"><input type="password" autocomplete="off" data-gk="${esc(g.g)}" value="${esc(GK[g.g]||"")}" placeholder="${esc(t("cat_key_ph"))}"></div>`
      :`<span class="tag demo">${t("keyless_tag")}</span>`)
      +(g.trial?`<span class="tag">${t("trial_tag")}</span>`:"")
      +(g.paid?`<span class="tag">${t("paid_tag")}</span>`:"");
    card.innerHTML=`<div class="gh">
        <span class="gn">${esc(gNameL(g))}</span>${kh}
        <button class="mini" data-all="1">${t("cat_add_all")}</button>
        <button class="mini" data-sync="1" title="${esc(t("sync_tip"))}">⟳ ${t("sync")}</button>
      </div>
      <div class="chips">${g.models.map((pm,mi)=>({pm,mi})).filter(x=>!q||(x.pm.n+" "+x.pm.id).toLowerCase().includes(q)||g.g.toLowerCase().includes(q)).map(({pm,mi})=>
        inList(g,pm)
          ?`<span class="chip in">${esc(nNameL(pm.n))} ✓</span>`
          :`<button class="chip" data-mi="${mi}">+ ${esc(nNameL(pm.n))}</button>`).join("")}
      </div>
      <div class="gnote">${esc(noteL(g))} · <a href="${esc(g.keyUrl)}" target="_blank" rel="noopener">${esc(g.keyUrl.replace("https://",""))}</a></div>`;
    const ki=card.querySelector("input[data-gk]");
    if(ki)ki.addEventListener("input",()=>{GK[g.g]=ki.value.trim();});
    card.addEventListener("click",e=>{
      const key=g.needKey?(GK[g.g]||card.querySelector("input")?.value.trim()||""):"";
      if(e.target.closest("[data-sync]")){
        if(g.needKey&&!key){toast(t("cat_key_first"));return;}
        const btn=e.target.closest("[data-sync]");btn.disabled=true;btn.textContent="⟳ …";
        syncGroup(g,key).then(n=>{
          if(n){saveState();renderModels();renderCatalog();fillCmpSelects();}
          toast(n?n+" "+t("cat_added"):t("sync_none"));
        }).catch(err=>{toast(t("sync_err")+err.message);btn.disabled=false;btn.textContent="⟳ "+t("sync");});
        return;
      }
      if(e.target.closest("[data-all]")){
        if(g.needKey&&!key){toast(t("cat_key_first"));return;}
        let n=0;g.models.forEach(pm=>{if(addFromCat(g,pm,key))n++;});
        if(n){saveState();renderModels();renderCatalog();fillCmpSelects();toast(n+" "+t("cat_added"));}
        return;
      }
      const b=e.target.closest("[data-mi]");if(!b)return;
      if(g.needKey&&!key){toast(t("cat_key_first"));return;}
      if(addFromCat(g,g.models[+b.dataset.mi],key)){
        saveState();renderModels();renderCatalog();fillCmpSelects();toast("1 "+t("cat_added"));
      }
    });
    box.appendChild(card);
  });
}

$("sync-all").onclick=syncAll;
$("f-q").addEventListener("input",()=>{FILT.q=$("f-q").value.trim();renderCatalog();$("f-q").focus();});
$("f-cats").addEventListener("click",e=>{const b=e.target.closest("[data-fc]");if(b){FILT.cat=b.dataset.fc;renderCatalog();}});
$("f-reg").addEventListener("change",()=>{FILT.reg=$("f-reg").value;renderCatalog();});

/* ---------------- consimțământ cloud ---------------- */
function hostOf(m){try{return new URL(m.baseUrl).host;}catch(e){return m.provider;}}
function needsCloudConsent(m){
  if(m.demo||m.provider==="demo"||m.provider==="browser"||m.provider==="chromeai"||m.provider==="transformersjs")return false;
  if(m.apiKey)return false;
  return !/^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/i.test(m.baseUrl||"")&&m.provider!=="ollama";
}
/* ---------------- data io ---------------- */
$("io-export").onclick=async()=>{
  let out=S;
  if(!$("io-keys").checked||(S.models.some(m=>m.apiKey)&&!(await ask(t("confirm_export_keys"),true)))){   // implicit FĂRĂ chei; cu chei doar dacă e bifat și confirmat
    out=JSON.parse(JSON.stringify(S));out.models.forEach(m=>{m.apiKey="";});
  }
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="arena-fara-frontiere-"+new Date().toISOString().slice(0,10)+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast(t("exported"));
};
$("io-import").onclick=()=>$("io-file").click();
$("io-file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    const sj=sanitizeState(j);if(!sj)throw new Error("format");
    S=sj;if(!S.models.length)S.models=defaultModels();LANG=LANGS.includes(S.lang)?S.lang:"ro";saveState();
    applyLang();renderModels();renderCatalog();renderBoard();fillCmpSelects();renderSuggest();
    toast(t("imported"));
  }catch(err){toast(t("bad_json"));}};
  r.readAsText(f);e.target.value="";
};
$("io-wipe").onclick=async()=>{
  if(!(await ask(t("confirm_wipe"),true)))return;
  try{localStorage.removeItem(SKEY);sessionStorage.removeItem(SKEY+"-keys");}catch(e){}
  S={lang:LANG,models:defaultModels(),ratings:{},history:[]};
  ensureKeyless(S);migrateV4(S);saveState();applyLang();renderModels();renderCatalog();renderBoard();fillCmpSelects();toast(t("wiped"));
};

/* ---------------- boot ---------------- */
applyLang();renderSuggest();renderModels();renderCatalog();renderBoard();fillCmpSelects();
if(!storageOK)toast(t("nostorage"));
</script>
