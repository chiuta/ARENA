/* ---------------- live sync (interoghează /models la provider) ---------------- */
const SYNC_CAP=40;
const NON_CHAT=/whisper|guard|embed|rerank|-tts|audio|moderation|safety|-ocr|image|vision-encoder|prompt-guard/i;
function isFreeModel(g,m){
  const id=m.id||m.name||"";
  if(NON_CHAT.test(id))return false;
  const rule=g.freeRule||"all";
  if(rule==="pricing")return (m.pricing&&parseFloat(m.pricing.prompt||"1")===0&&parseFloat(m.pricing.completion||"1")===0)||/:free$/.test(id);
  if(rule==="suffix")return /:free$/.test(id);
  if(rule==="zen")return /-free$/.test(id)||id==="big-pickle"||(m.cost&&parseFloat(m.cost.input||"1")===0);
  return true; // "all": pe free tier, tot ce listează providerul e apelabil
}
async function syncGroup(g,key){
  const base=g.baseUrl.replace(/\/+$/,"");
  let url=base+"/models";
  let headers={};
  if(g.provider==="anthropic"){
    url=base+"/v1/models";
    headers=FFF.ai.anthropicHeaders(key||"");
  }else if(key)headers["Authorization"]="Bearer "+key;
  const resp=await fetch(url,{headers,signal:(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)?AbortSignal.timeout(20000):undefined});
  if(!resp.ok)throw new Error(resp.status+"");
  const j=await resp.json();
  const arr=Array.isArray(j)?j:(j.data||j.models||[]);
  let n=0;
  for(const m of arr){
    if(n>=SYNC_CAP)break;
    const id=typeof m==="string"?m:(m.id||m.name);
    if(!id)continue;
    const mm=typeof m==="string"?{id}:m;
    if(!isFreeModel(g,mm))continue;
    if(addFromCat(g,{id,n:(mm.name&&mm.name!==id?mm.name:id)+" · "+gNameL(g)},key))n++;
  }
  return n;
}

function storedKeyFor(g){const m=S.models.find(x=>x.baseUrl===g.baseUrl&&x.apiKey);return m?m.apiKey:"";}
async function syncAll(){
  const btn=$("sync-all");btn.disabled=true;
  let total=0,done=0,skipped=[];
  for(const g of FREE_2026){
    const key=g.needKey?storedKeyFor(g):"";
    if(g.needKey&&!key){skipped.push(g.g);continue;}
    try{total+=await syncGroup(g,key);done++;}catch(e){skipped.push(g.g);}
  }
  if(total){saveState();renderModels();renderCatalog();fillCmpSelects();}
  toast(total+" "+t("cat_added")+" ("+done+" "+t("sync_groups")+(skipped.length?", "+t("sync_skipped")+" "+skipped.length:"")+")");
  btn.disabled=false;
}

        const btn=e.target.closest("[data-sync]");btn.disabled=true;btn.textContent="⟳ …";
        syncGroup(g,key).then(n=>{
          if(n){saveState();renderModels();renderCatalog();fillCmpSelects();}
          toast(n?n+" "+t("cat_added"):t("sync_none"));
        }).catch(err=>{toast(t("sync_err")+err.message);btn.disabled=false;btn.textContent="⟳ "+t("sync");});
        return;
      }
      if(e.target.closest("[data-all]")){
        if(g.needKey&&!key){toast(t("cat_key_first"));return;}
        let n=0;g.models.forEach(pm=>{if(addFromCat(g,pm,key))n++;});
        if(n){saveState();renderModels();renderCatalog();fillCmpSelects();toast(n+" "+t("cat_added"));}
        return;
      }
      const b=e.target.closest("[data-mi]");if(!b)return;
      if(g.needKey&&!key){toast(t("cat_key_first"));return;}
      if(addFromCat(g,g.models[+b.dataset.mi],key)){
        saveState();renderModels();renderCatalog();fillCmpSelects();toast("1 "+t("cat_added"));
      }
    });
    box.appendChild(card);
  });
}

function hostOf(m){try{return new URL(m.baseUrl).host;}catch(e){return m.provider;}}
function needsCloudConsent(m){
  if(m.demo||m.provider==="demo"||m.provider==="browser"||m.provider==="chromeai"||m.provider==="transformersjs")return false;
  if(m.apiKey)return false;
  return !/^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/i.test(m.baseUrl||"")&&m.provider!=="ollama";
}
/* ---------------- data io ---------------- */
$("io-export").onclick=async()=>{
  let out=S;
  if(!$("io-keys").checked||(S.models.some(m=>m.apiKey)&&!(await ask(t("confirm_export_keys"),true)))){   // implicit FĂRĂ chei; cu chei doar dacă e bifat și confirmat
    out=JSON.parse(JSON.stringify(S));out.models.forEach(m=>{m.apiKey="";});
  }
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="arena-fara-frontiere-"+new Date().toISOString().slice(0,10)+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast(t("exported"));
};
$("io-import").onclick=()=>$("io-file").click();
$("io-file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    const sj=sanitizeState(j);if(!sj)throw new Error("format");
    S=sj;if(!S.models.length)S.models=defaultModels();LANG=LANGS.includes(S.lang)?S.lang:"ro";saveState();
    applyLang();renderModels();renderCatalog();renderBoard();fillCmpSelects();renderSuggest();
    toast(t("imported"));
  }catch(err){toast(t("bad_json"));}};
  r.readAsText(f);e.target.value="";
};
$("io-wipe").onclick=async()=>{
  if(!(await ask(t("confirm_wipe"),true)))return;
  try{localStorage.removeItem(SKEY);sessionStorage.removeItem(SKEY+"-keys");}catch(e){}
  KVault.remove();if(KVctl)KVctl.render();
  S={lang:LANG,models:defaultModels(),ratings:{},history:[]};
  ensureKeyless(S);migrateV4(S);saveState();applyLang();renderModels();renderCatalog();renderBoard();fillCmpSelects();toast(t("wiped"));
};

applyLang();renderSuggest();renderModels();renderCatalog();renderBoard();fillCmpSelects();

var sess=null; // {id, idx}
var curSet=""; // id selectat în editor
function $i(i){return document.getElementById(i);}
function setById(id){return (S.sets||[]).find(function(q){return q.id===id;})||null;}
function parseItems(txt){
  return String(txt||"").split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).slice(0,200).map(function(l){
    var k=l.indexOf("|");
    if(k>=0&&k<=40){var c=l.slice(0,k).trim(),p=l.slice(k+1).trim();if(p)return {c:c,p:p.slice(0,2000)};}
    return {c:"",p:l.slice(0,2000)};
  });
}
function itemsToText(items){return items.map(function(x){return x.c?x.c+" | "+x.p:x.p;}).join("\n");}
function fillSel(){
  var sel=$i("ev-sel");if(!S.sets)S.sets=[];
  sel.innerHTML="";
  var o=document.createElement("option");o.value="";o.textContent=t("ev_none");sel.appendChild(o);
  S.sets.forEach(function(q){var p=document.createElement("option");p.value=q.id;p.textContent=q.name+" ("+q.items.length+")";sel.appendChild(p);});
  sel.value=setById(curSet)?curSet:"";
  if(!sel.value)curSet="";
}
function loadEditor(){
  var q=setById(curSet);
  $i("ev-name").value=q?q.name:"";
  $i("ev-items").value=q?itemsToText(q.items):"";
}

$i("ev-demo").onclick=function(){
  if(!S.sets)S.sets=[];
  var n=0;
  DEMO_SETS.forEach(function(d){
    if(setById(d.id))return;
    if(S.sets.length>=50)S.sets.shift();
    S.sets.push({id:d.id,name:d.name,items:d.items.map(function(x){return {c:x.c,p:x.p};})});n++;
  });
  saveState();fillSel();toast(n?t("ev_demo_added").replace("{n}",n):t("ev_demo_have"));
};
$i("ev-sel").onchange=function(){curSet=this.value;loadEditor();};
$i("ev-new").onclick=function(){curSet="";fillSel();loadEditor();$i("ev-name").focus();};
$i("ev-save").onclick=function(){
  var name=$i("ev-name").value.trim().slice(0,60),items=parseItems($i("ev-items").value);
  if(!name||!items.length){toast(t("ev_need"));return;}
  if(!S.sets)S.sets=[];
  var q=setById(curSet);
  if(q){q.name=name;q.items=items;}
  else{
    if(S.sets.length>=50){S.sets.shift();}
    q={id:"s"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),name:name,items:items};S.sets.push(q);curSet=q.id;
  }
  saveState();fillSel();toast(t("ev_saved"));
};
$i("ev-del").onclick=async function(){
  var q=setById(curSet);if(!q)return;
  if(!(await ask(t("ev_confirm_del"),true)))return;
  S.sets=S.sets.filter(function(x){return x.id!==q.id;});
  if(sess&&sess.id===q.id)endSession(true);
  curSet="";saveState();fillSel();loadEditor();toast(t("ev_deleted"));
};
/* sesiune */
function banner(msg){var b=$i("ev-banner");if(!msg){b.hidden=true;b.textContent="";return;}b.hidden=false;b.textContent=msg;}
function loadItem(){
  var q=sess&&setById(sess.id);if(!q){endSession(true);return false;}
  var it=q.items[sess.idx];
  $i("d-prompt").value=it.p;
  banner(t("ev_prog").replace("{n}",q.name).replace("{i}",sess.idx+1).replace("{t}",q.items.length).replace("{c}",it.c?" · "+it.c:""));
  return true;
}
function endSession(silent){sess=null;banner("");if(!silent)toast(t("ev_end"));}
$i("ev-start").onclick=function(){
  var q=setById(curSet);
  if(!q){toast(t("ev_need"));return;}
  sess={id:q.id,idx:0};
  document.querySelector('#nav button[data-tab="duel"]').click();
  if(loadItem()&&!$i("d-go").disabled)$i("d-go").click();
};
/* eticheta categoriei se aplică doar dacă promptul din câmp e cel al sesiunii */
window.evCatFor=function(prompt){
  var q=sess&&setById(sess.id);if(!q)return "";
  var it=q.items[sess.idx];
  return it&&it.p.trim()===prompt.trim()?it.c:"";
};
$i("d-again").addEventListener("click",function(){
  if(!sess)return;
  var q=setById(sess.id);
  if(!q||sess.idx+1>=q.items.length){endSession(false);return;}
  sess.idx++;
  if(loadItem()&&!$i("d-go").disabled)$i("d-go").click();
});
/* Elo pe categorii, recalculat din istoric (aceeași formulă K=32) */
function catList(){
  var m={};(S.history||[]).forEach(function(h){if(h.c)m[h.c]=1;});
  return Object.keys(m).sort();
}
function catStats(cat){
  var R={};
  function g(id){return R[id]||(R[id]={elo:1000,w:0,d:0,l:0,m:0});}
  (S.history||[]).forEach(function(h){
    if(cat!==null&&(h.c||"")!==cat)return;
    var A=g(h.a),B=g(h.b);
    var e=1/(1+Math.pow(10,(B.elo-A.elo)/400)),d=Math.round(32*(h.s-e));
    A.elo+=d;B.elo-=d;A.m++;B.m++;
    if(h.s===1){A.w++;B.l++;}else if(h.s===0){A.l++;B.w++;}else{A.d++;B.d++;}
  });
  return S.models.filter(function(m){return R[m.id]&&R[m.id].m>0;}).map(function(m){return {m:m,r:R[m.id]};}).sort(function(x,y){return y.r.elo-x.r.elo;});
}
window.arenaCatStats=catStats;
var baseBoard=renderBoard;
renderBoard=function(){
  var cats=catList(),row=$i("b-catrow"),sel=$i("b-cat"),cur=sel.value;
  row.hidden=!cats.length;
  sel.innerHTML="";
  var o=document.createElement("option");o.value="";o.textContent=t("ev_all");sel.appendChild(o);
  cats.forEach(function(c){var p=document.createElement("option");p.value=c;p.textContent=c;sel.appendChild(p);});
  sel.value=cats.indexOf(cur)>=0?cur:"";
  if(!sel.value){baseBoard();return;}
  var rows=catStats(sel.value),wrap=$i("board-wrap");
  if(!rows.length){baseBoard();return;}
  var mx=Math.max.apply(null,rows.map(function(x){return x.r.elo;}));
  wrap.innerHTML="<table><thead><tr><th>"+t("th_rank")+"</th><th>"+t("th_model")+"</th><th class=\"num\">"+t("th_elo")+"</th><th class=\"num\">"+t("th_m")+"</th><th class=\"num\">"+t("th_w")+"</th><th class=\"num\">"+t("th_d")+"</th><th class=\"num\">"+t("th_l")+"</th></tr></thead><tbody>"+
  rows.map(function(x,i){return "<tr><td><span class=\"rk\">"+(i+1)+"</span></td><td>"+esc(x.m.name)+"<div class=\"bar\"><i style=\"width:"+Math.round(x.r.elo/mx*100)+"%\"></i></div></td><td class=\"num\">"+x.r.elo+"</td><td class=\"num\">"+x.r.m+"</td><td class=\"num\">"+x.r.w+"</td><td class=\"num\">"+x.r.d+"</td><td class=\"num\">"+x.r.l+"</td></tr>";}).join("")+"</tbody></table>";
};
$i("b-cat").onchange=function(){renderBoard();};
/* raport JSON: fără chei API, fără text de prompt (doar numărul de dueluri pe categorie) */
function buildReport(){
  function pack(rows){return rows.map(function(x,i){return {rank:i+1,model:x.m.name,provider:x.m.provider,elo:x.r.elo,duels:x.r.m,wins:x.r.w,draws:x.r.d,losses:x.r.l};});}
  var cats={};
  catList().forEach(function(c){cats[c]=pack(catStats(c));});
  var un=catStats("");
  if(un.length)cats[t("ev_nocat")]=pack(un);
  return {app:"arena",kind:"blind-evaluation-report",generated:new Date().toISOString(),duels:(S.history||[]).length,overall:pack(catStats(null)),categories:cats};
}
window.arenaReport=buildReport;
$i("b-json").onclick=function(){
  if(!(S.history||[]).length){toast(t("ev_json_empty"));return;}
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(buildReport(),null,2)],{type:"application/json"}));
  a.download="arena-raport-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);toast(t("ev_json_done"));
};
document.querySelector('#nav button[data-tab="eval"]').addEventListener("click",function(){fillSel();loadEditor();});
fillSel();
applyLang();renderBoard();
})();
