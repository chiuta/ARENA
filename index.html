<title>Arena fără frontiere</title>
<style>
:root{
  --bg:#161320; --panel:#1e1a2b; --panel2:#262138; --line:#372f52; --line2:#4a4070;
  --text:#ece7db; --dim:#9b93ac; --faint:#9088a8;
  --gold:#d9a441; --gold-soft:#e8c37a; --teal:#4ec2b3; --teal-soft:#8adfd3;
  --red:#e07a7a; --green:#7fbf7a;
  --r:12px;
  --serif:"Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--line2) var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(ellipse 90% 55% at 50% -12%,rgba(217,164,65,.09),transparent 62%),
                   radial-gradient(ellipse 75% 45% at 50% 112%,rgba(78,194,179,.06),transparent 60%)}
a{color:var(--gold-soft)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
::placeholder{color:var(--faint)}

/* ------- shell ------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header{padding:26px 0 10px;text-align:center}
.title{margin:0;font-weight:400;font-family:var(--serif);font-size:clamp(26px,4.5vw,40px);letter-spacing:.06em;color:var(--gold-soft)}
.title b{font-weight:400;color:var(--text)}
.laurel{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--faint);margin-top:4px}
.laurel::before,.laurel::after{content:"";height:1px;width:min(160px,26vw);background:linear-gradient(90deg,transparent,var(--line2));}
.laurel::after{background:linear-gradient(90deg,var(--line2),transparent)}
.tagline{font-size:12.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
#nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px}
#nav button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:13.5px;letter-spacing:.04em}
#nav button:hover{color:var(--text);border-color:var(--line2)}
#nav button.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:600}
.langs{margin:0;position:absolute;top:14px;right:14px;display:flex;gap:4px}
.langs button{padding:4px 9px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.langs button.on{color:var(--gold-soft);border-color:var(--gold)}
main section{display:none}
main section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ------- prompt bar ------- */
.promptbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.promptbox textarea{min-height:74px;resize:vertical;background:var(--bg)}
.pb-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241c08;font-weight:700}
.btn.primary:hover{background:var(--gold-soft)}
.btn.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--faint)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest button{font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:999px;padding:4px 10px}
.suggest button:hover{color:var(--gold-soft);border-color:var(--gold)}

/* ------- duel panes ------- */
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:220px;overflow:hidden}
.pane.a{border-top:3px solid var(--gold)}
.pane.b{border-top:3px solid var(--teal)}
.pane-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--serif);letter-spacing:.05em}
.pane.a .pane-h{color:var(--gold-soft)} .pane.b .pane-h{color:var(--teal-soft)}
.pane-h .who{font-size:16px}
.pane-h .real{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.pane-h .delta{font-family:var(--mono);font-size:12px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.pane-b{padding:14px;white-space:pre-wrap;overflow-wrap:break-word;flex:1;font-size:14.5px}
.pane-b.err{color:var(--red)}
.cursor::after{content:"▍";color:var(--gold);animation:blink 1s steps(1) infinite}
.pane.b .cursor::after{color:var(--teal)}
@keyframes blink{50%{opacity:0}}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:conic-gradient(from 210deg,var(--gold) 0 50%,var(--teal) 50% 100%);padding:2px;z-index:2;pointer-events:none}
.vs i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
  background:var(--bg);font-family:var(--serif);font-style:normal;font-size:17px;letter-spacing:.08em;color:var(--text)}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.vote button{padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13.5px}
.vote button:hover:not(:disabled){transform:translateY(-1px)}
.vote .va:hover:not(:disabled){border-color:var(--gold);color:var(--gold-soft)}
.vote .vb:hover:not(:disabled){border-color:var(--teal);color:var(--teal-soft)}
.vote button:disabled{opacity:.4;cursor:not-allowed}
.verdict{margin-top:14px;text-align:center;font-family:var(--serif);font-size:17px;color:var(--gold-soft);display:none}
.verdict.on{display:block;animation:fade .4s ease}
.postrow{display:none;justify-content:center;gap:10px;margin-top:12px}
.postrow.on{display:flex}

/* ------- leaderboard ------- */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr:last-child td{border-bottom:none}
td .rk{font-family:var(--serif);color:var(--gold-soft);font-size:15px}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal))}
.empty{padding:34px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}

/* ------- compare ------- */
.cmp-sel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.cmp-sel label{font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}

/* ------- settings ------- */
.cardlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mcard .nm{font-family:var(--serif);font-size:16px}
.mcard .meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
.mcard .sp{flex:1}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:5px;padding:2px 7px;color:var(--dim)}
.tag.demo{color:var(--teal-soft);border-color:var(--teal)}
.mini{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.mini:hover{color:var(--text);border-color:var(--line2)}
.mini.danger:hover{color:var(--red);border-color:var(--red)}
.st{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.st.ok{color:var(--green);border-color:var(--green)}
.st.bad{color:var(--red);border-color:var(--red)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;display:none}
.form.on{display:block}
.form h3{font-family:var(--serif);font-weight:400;margin-bottom:10px;color:var(--gold-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;display:block;margin:6px 0 3px}
.io{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#ev-items{width:100%;box-sizing:border-box;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
#ev-name{width:100%;box-sizing:border-box}
#ev-banner{color:var(--gold-soft)}
#b-catrow{margin:8px 0}
.note{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.6}
h2.sec{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--gold-soft);letter-spacing:.04em;margin:6px 0 10px}
.toggle{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.toggle.on{background:var(--gold)}
.toggle.on::after{transform:translateX(16px);background:#241c08}

/* ------- free catalog ------- */
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.gcard .gh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.gcard .gn{font-family:var(--serif);font-size:16px;color:var(--gold-soft)}
.gcard .gk{flex:1;min-width:180px}
.gcard .gk input{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.chip:hover{color:var(--teal-soft);border-color:var(--teal)}
.chip.in{color:var(--faint);border-style:dashed;cursor:default}
.gnote{font-size:12px;color:var(--faint);margin-top:8px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:10px}
.fbar input[type=search]{flex:1;min-width:160px;padding:6px 10px;font-size:13px}
.fbar select{width:auto;padding:6px 10px;font-size:13px}
.fchip{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.fchip.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:600}
.fcount{font-family:var(--mono);font-size:12px;color:var(--faint);width:100%;margin-top:2px}
.gnote a{color:var(--teal-soft)}

/* ------- toast ------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-size:14px;transition:transform .25s ease;z-index:9}
#toast.on{transform:translateX(-50%) translateY(0)}

footer{margin-top:44px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8}
footer .sig{font-family:var(--serif);letter-spacing:.08em;color:var(--dim)}

@media(max-width:760px){
  .duel,.cmp-sel,.grid2{grid-template-columns:1fr}
  .vs{display:none}
  .vote{grid-template-columns:1fr 1fr}
  .langs{position:static;justify-content:center;flex-wrap:wrap;margin-top:8px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (pointer:coarse){.toggle::before{content:"";position:absolute;inset:-11px -3px}}   /* zonă de atingere de 44 px în jurul comutatorului de 38×22 */
@media (pointer:coarse){html body .langs button,html body button[data-tab],html body .suggest button,html body button[class*="r8a-"],html body .d-go,html body .c-go,html body .mini,html body .fchip,html body .chip,html body #c-selA,html body #c-selB,html body #f-reg,html body #f-q,html body input[data-gk]{min-height:44px;min-width:44px}}
</style>

<body>
<nav class="langs" id="langs" aria-label="Limbă / Language"></nav>
<div class="wrap">

<header>
  <h1 class="title">ARENA <b>fără frontiere</b></h1>
  <div class="laurel"><span class="tagline" data-i18n="tagline"></span></div>
</header>

<nav id="nav">
  <button data-tab="duel" class="on" data-i18n="tab_duel"></button>
  <button data-tab="cmp" data-i18n="tab_cmp"></button>
  <button data-tab="board" data-i18n="tab_board"></button>
  <button data-tab="eval" data-i18n="tab_eval"></button>
  <button data-tab="set" data-i18n="tab_set"></button>
</nav>

<main>

<!-- ============ DUEL ============ -->
<section id="tab-duel" class="on">
  <div class="promptbox">
    <textarea id="d-prompt" data-i18n-ph="prompt_ph"></textarea>
    <div class="suggest" id="d-suggest"></div>
    <div class="pb-row">
      <button class="btn primary" id="d-go" data-i18n="fight"></button>
      <button class="btn" id="d-stop" style="display:none" data-i18n="stop"></button>
      <span class="hint" data-i18n="duel_hint"></span>
    </div>
  </div>

  <div class="duel">
    <div class="pane a">
      <div class="pane-h"><span class="who" id="d-wa">⚔ A</span><span class="real" id="d-ra"></span><span class="delta" id="d-da"></span></div>
      <div class="pane-b" id="d-pa"></div>
    </div>
    <div class="vs"><i>VS</i></div>
    <div class="pane b">
      <div class="pane-h"><span class="who" id="d-wb">⚔ B</span><span class="real" id="d-rb"></span><span class="delta" id="d-db"></span></div>
      <div class="pane-b" id="d-pb"></div>
    </div>
  </div>

  <div class="vote">
    <button class="va" id="v-a" disabled data-i18n="v_a"></button>
    <button class="vb" id="v-b" disabled data-i18n="v_b"></button>
    <button id="v-tie" disabled data-i18n="v_tie"></button>
    <button id="v-bad" disabled data-i18n="v_bad"></button>
  </div>

  <p class="note" data-i18n="kb_hint"></p>
  <p class="note" id="ev-banner" aria-live="polite" hidden></p>
    <div class="verdict" id="d-verdict"></div>
  <div class="postrow" id="d-post">
    <button class="btn primary" id="d-again" data-i18n="again"></button>
  </div>
</section>

<!-- ============ COMPARE ============ -->
<section id="tab-cmp">
  <div class="cmp-sel">
    <div><label for="c-selA" data-i18n="cmp_left"></label><select id="c-selA"></select></div>
    <div><label for="c-selB" data-i18n="cmp_right"></label><select id="c-selB"></select></div>
  </div>
  <div class="promptbox">
    <textarea id="c-prompt" data-i18n-ph="prompt_ph"></textarea>
    <div class="pb-row">
      <button class="btn primary" id="c-go" data-i18n="compare"></button>
      <span class="hint" data-i18n="cmp_hint"></span>
    </div>
  </div>
  <div class="duel">
    <div class="pane a">
      <div class="pane-h"><span class="who" id="c-wa">—</span></div>
      <div class="pane-b" id="c-pa"></div>
    </div>
    <div class="pane b">
      <div class="pane-h"><span class="who" id="c-wb">—</span></div>
      <div class="pane-b" id="c-pb"></div>
    </div>
  </div>
</section>

<!-- ============ EVALUATION (prompt sets) ============ -->
<section id="tab-eval">
  <h2 class="sec" data-i18n="ev_title"></h2>
  <p class="note" data-i18n="ev_note"></p>
  <div class="cmp-sel">
    <div><label for="ev-sel" data-i18n="ev_sets"></label><select id="ev-sel"></select></div>
    <div><label for="ev-name" data-i18n="ev_name"></label><input id="ev-name" maxlength="60" autocomplete="off"></div>
  </div>
  <label for="ev-items" data-i18n="ev_items"></label>
  <textarea id="ev-items" rows="8" data-i18n-ph="ev_items_ph"></textarea>
  <p class="note" data-i18n="ev_demo_hint"></p>
  <div class="io">
    <button class="btn primary" id="ev-start" data-i18n="ev_start"></button>
    <button class="btn" id="ev-save" data-i18n="ev_save"></button>
    <button class="btn" id="ev-new" data-i18n="ev_new"></button>
    <button class="btn" id="ev-del" data-i18n="ev_del"></button>
    <button class="btn" id="ev-demo" data-i18n="ev_demo"></button>
  </div>
</section>

<!-- ============ LEADERBOARD ============ -->
<section id="tab-board">
  <h2 class="sec" data-i18n="board_title"></h2>
  <div id="b-catrow" hidden><label for="b-cat" data-i18n="ev_cat"></label> <select id="b-cat"></select></div>
  <div id="board-wrap"></div>
  <div class="io">
    <button class="btn" id="b-json" data-i18n="ev_json"></button>
    <button class="btn" id="b-csv" data-i18n="board_csv"></button>
    <button class="btn" id="b-reset" data-i18n="board_reset"></button>
  </div>
  <p class="note" data-i18n="board_note"></p>
</section>

<!-- ============ SETTINGS ============ -->
<section id="tab-set">
  <h2 class="sec" data-i18n="set_models"></h2>
  <div class="cardlist" id="mlist"></div>
  <div class="io">
    <button class="btn primary" id="m-add" data-i18n="add_model"></button>
    <button class="btn" id="m-testall" data-i18n="test_all"></button>
  </div>

  <div class="form" id="mform">
    <h3 id="mf-title"></h3>
    <div class="grid2">
      <div class="full"><label for="f-name" data-i18n="f_name"></label><input id="f-name" placeholder="ex: Claude Sonnet 4.6"></div>
      <div><label for="f-prov" data-i18n="f_prov"></label>
        <select id="f-prov">
          <option value="openai">OpenAI-compatible</option>
          <option value="pollinations">Pollinations (cheie opțională)</option>
          <option value="browser">În browser (WebLLM · WebGPU)</option>
          <option value="chromeai">AI încorporat în browser (Gemini Nano)</option>
          <option value="transformersjs">Transformers.js (WASM/WebGPU)</option>
          <option value="anthropic">Anthropic</option>
          <option value="ollama">Ollama (local)</option>
        </select>
      </div>
      <div><label for="f-model" data-i18n="f_model"></label><input id="f-model" placeholder="ex: claude-sonnet-5-5"></div>
      <div class="full"><label for="f-url" data-i18n="f_url"></label><input id="f-url" placeholder="https://api.openai.com/v1"></div>
      <div class="full"><label for="f-key" data-i18n="f_key"></label><input id="f-key" type="password" autocomplete="off" placeholder="sk-…"></div>
    </div>
    <div class="pb-row">
      <button class="btn primary" id="mf-save" data-i18n="save"></button>
      <button class="btn" id="mf-cancel" data-i18n="cancel"></button>
    </div>
  </div>

  <h2 class="sec" style="margin-top:26px" data-i18n="cat_title"></h2>
  <p class="note" data-i18n="cat_note"></p>
  <div class="fbar" id="fbar">
    <input type="search" id="f-q" data-i18n-ph="f_search">
    <span id="f-cats"></span>
    <select id="f-reg" aria-label="Regiune / Region"></select>
    <span class="fcount" id="f-count"></span>
  </div>
  <div class="io" style="margin-top:10px"><button class="btn primary" id="sync-all" data-i18n="sync_all"></button></div>
  <div id="catlist"></div>

  <h2 class="sec" style="margin-top:26px" data-i18n="set_data"></h2>
  <div class="io">
    <button class="btn" id="io-export" data-i18n="exportd"></button>
    <button class="btn" id="io-import" data-i18n="importd"></button>
    <button class="btn" id="io-wipe" data-i18n="wipe"></button>
    <label class="note" style="display:block;width:100%;margin-top:6px"><input type="checkbox" id="io-keys"> <span data-i18n="export_keys"></span></label>
    <input type="file" id="io-file" accept="application/json" style="display:none">
  </div>
  <div id="kv-host"></div>
  <p class="note"><label><input type="checkbox" id="keys-session"> <span data-i18n="keys_session"></span></label></p>
  <p class="note" data-i18n="set_note"></p>
</section>

</main>

<footer>
  <span class="sig">Arena fără frontiere</span><br>
  <span data-i18n="foot"></span><br>
  <span data-i18n="cloudnote"></span><br>
  <span><span data-i18n="verLabel">Versiune</span> <span id="app-version">v 2.2.14 · 2026-11-13</span></span>
</footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script id="keyvault">
/* KeyVault 1.0.0 — criptare OPȚIONALĂ cu parolă pentru chei API: WebCrypto AES-256-GCM + PBKDF2-SHA256 (600000 iterații, sare aleatoare de 16 octeți).
   Fără rețea, fără dependențe. Componentă NEAUDITATĂ de un terț; aceeași copie în AI-Liber, Nexus-fara-frontiere și ARENA. */
(function (g) {
  'use strict';
  var ITER = 600000, ITER_MAX = 5000000, PW_MIN = 12, enc = new TextEncoder(), dec = new TextDecoder(), AAD = enc.encode('KeyVault/1');
  function b64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function sub() { if (!g.crypto || !g.crypto.subtle) throw new Error('WebCrypto'); return g.crypto.subtle; }
  function derive(pw, salt, it) {
    return sub().importKey('raw', enc.encode(String(pw)), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return sub().deriveKey({ name: 'PBKDF2', salt: salt, iterations: it, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function seal(key, salt, it, text) {
    var iv = g.crypto.getRandomValues(new Uint8Array(12));
    return sub().encrypt({ name: 'AES-GCM', iv: iv, additionalData: AAD }, key, enc.encode(text)).then(function (ct) {
      return JSON.stringify({ kv: 1, kdf: 'PBKDF2-SHA256', it: it, s: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) });
    });
  }
  function parse(blob) {
    var o; try { o = JSON.parse(blob); } catch (e) { throw new Error('format'); }
    if (!o || o.kv !== 1 || typeof o.it !== 'number' || o.it < ITER || o.it > ITER_MAX || !o.s || !o.iv || !o.ct) throw new Error('format');
    return o;
  }
  function open(key, o) { return sub().decrypt({ name: 'AES-GCM', iv: unb64(o.iv), additionalData: AAD }, key, unb64(o.ct)).then(function (pt) { return dec.decode(pt); }); }
  /* criptare / decriptare independente (șir -> șir JSON) */
  function encrypt(pw, text) { var salt = g.crypto.getRandomValues(new Uint8Array(16)); return derive(pw, salt, ITER).then(function (k) { return seal(k, salt, ITER, text); }); }
  function decrypt(pw, blob) { var o = parse(blob); return derive(pw, unb64(o.s), o.it).then(function (k) { return open(k, o); }); }

  /* seif: un șir JSON {furnizor: cheie} criptat sub o singură cheie de stocare; cheia derivată rămâne doar în memorie cât e deblocat */

 laconic:{ro:{name:"Laconic (demo)",open:["Pe scurt:","Direct:","Esența:"],mid:["Un singur lucru contează aici — miezul întrebării.","Restul e zgomot; păstrează doar ce poți verifica.","Dacă nu încape într-o frază, nu e încă înțeles."],close:["Atât.","Restul e exercițiu pentru cititor.","Simplu."]},

 rapsod:{ro:{name:"Rapsodul (demo)",open:["Închipuie-ți o clipă:","Ascultă:","E o poveste veche în întrebarea ta —"],mid:["fiecare idee e un fir de nisip în arena timpului, și totuși nisipul ține pași de gladiatori.","ce întrebi tu au întrebat și alții, la lumina altor focuri, și răspunsul s-a schimbat cu fiecare limbă în care a fost rostit.","există o frumusețe discretă în a nu ști încă — spațiul acela e locul unde crește gândirea."],close:["Așa se încheie cântul; al tău începe acum.","Iar arena, ca întotdeauna, aplaudă întrebarea, nu răspunsul.","Punct, și de la capăt."]},
             en:{name:"The Rhapsode (demo)",open:["Imagine, for a moment:","Listen:","There is an old story inside your question —"],mid:["every idea is a grain of sand in the arena of time, and yet the sand carries the steps of gladiators.","what you ask, others asked by other fires, and the answer changed with every language it was spoken in.","there is a quiet beauty in not knowing yet — that space is where thinking grows."],close:["So ends the song; yours begins now.","And the arena, as always, applauds the question, not the answer.","Full stop, and again from the top."]},
              fr:{name:"Le Rhapsode (démo)",open:["Imagine un instant :","Écoute :","Il y a une vieille histoire dans ta question —"],mid:["chaque idée est un grain de sable dans l'arène du temps, et pourtant le sable garde les pas des gladiateurs.","ce que tu demandes, d'autres l'ont demandé près d'autres feux, et la réponse a changé avec chaque langue qui l'a prononcée.","il y a une beauté discrète à ne pas encore savoir — cet espace est l'endroit où la pensée grandit."],close:["Ainsi s'achève le chant ; le tien commence maintenant.","Et l'arène, comme toujours, applaudit la question, non la réponse.","Point final, et on reprend du début."]}},
 analist:{ro:{name:"Analistul (demo)",open:["Să structurăm.","Descompun problema în trei părți.","Metodic:"],mid:["Întâi definițiile: fără termeni clari, orice concluzie e fragilă. Apoi datele: ce știm sigur, ce doar presupunem. La final, inferența: pasul cel mai mic care leagă una de alta.","Ipoteza de lucru trebuie să fie falsificabilă; altfel discutăm gusturi, nu fapte. Verific premisele una câte una și marchez explicit incertitudinea.","Există cel puțin două interpretări plauzibile. Le compar după predicțiile pe care le fac, nu după cât de elegant sună."],close:["Concluzie provizorie, deschisă la revizuire.","Q.E.D. — cu asterisc.","Datele noi bat opiniile vechi."]},
              en:{name:"The Analyst (demo)",open:["Let's structure this.","I'll decompose the problem into three parts.","Methodically:"],mid:["First, definitions: without clear terms, any conclusion is fragile. Then the data: what we know, what we merely assume. Finally, inference: the smallest step linking one to the other.","A working hypothesis must be falsifiable; otherwise we're discussing taste, not fact. I check premises one by one and mark uncertainty explicitly.","There are at least two plausible readings. I compare them by the predictions they make, not by how elegant they sound."],close:["Provisional conclusion, open to revision.","Q.E.D. — with an asterisk.","New data beats old opinions."]},
              fr:{name:"L'Analyste (démo)",open:["Structurons.","Je décompose le problème en trois parties.","Méthodiquement :"],mid:["D'abord les définitions : sans termes clairs, toute conclusion est fragile. Ensuite les données : ce que nous savons, ce que nous supposons seulement. Enfin l'inférence : le plus petit pas qui relie l'un à l'autre.","Une hypothèse de travail doit être falsifiable ; sinon nous discutons de goûts, pas de faits. Je vérifie les prémisses une à une et je signale explicitement l'incertitude.","Il existe au moins deux lectures plausibles. Je les compare d'après les prédictions qu'elles font, non d'après leur élégance."],close:["Conclusion provisoire, ouverte à révision.","C.Q.F.D. — avec un astérisque.","Les données nouvelles battent les vieilles opinions."]}},
 sceptic:{ro:{name:"Scepticul (demo)",open:["Stai puțin.","Înainte de răspuns, o obiecție.","Hm — întrebarea ascunde o premisă."],mid:["Cine spune că întrebarea e pusă corect? De multe ori răspunsul greșit vine dintr-o întrebare acceptată prea repede.","Aș vrea surse, nu impresii. Până atunci, răspunsul cinstit e „nu știm încă destul”.","Atenție la ce pare evident: evidentul e locul unde se ascund cele mai vechi erori."],close:["Îndoiala rămâne cel mai bun instrument din arenă.","Verifică-mă. Serios.","Nu mă crede pe cuvânt — asta e tot mesajul."]},
              en:{name:"The Skeptic (demo)",open:["Hold on.","Before an answer, an objection.","Hm — the question hides a premise."],mid:["Who says the question is well posed? Wrong answers often come from questions accepted too quickly.","I'd want sources, not impressions. Until then, the honest answer is “we don't know enough yet”.","Beware of the obvious: the obvious is where the oldest errors hide."],close:["Doubt remains the best instrument in the arena.","Check me. Seriously.","Don't take my word for it — that's the whole message."]},
              fr:{name:"Le Sceptique (démo)",open:["Une seconde.","Avant la réponse, une objection.","Hm — la question cache une prémisse."],mid:["Qui dit que la question est bien posée ? Souvent, la mauvaise réponse vient d'une question acceptée trop vite.","Je voudrais des sources, pas des impressions. D'ici là, la réponse honnête est « nous n'en savons pas encore assez ».","Méfie-toi de l'évident : l'évident est l'endroit où se cachent les plus vieilles erreurs."],close:["Le doute reste le meilleur instrument de l'arène.","Vérifie-moi. Sérieusement.","Ne me crois pas sur parole — tout le message est là."]}}

  rapsod:{name:"Il Rapsodo (demo)",open:["Immagina per un attimo:","Ascolta:","C'è una vecchia storia dentro la tua domanda —"],mid:["ogni idea è un granello di sabbia nell'arena del tempo, eppure la sabbia conserva i passi dei gladiatori.","ciò che chiedi tu, altri l'hanno chiesto accanto ad altri fuochi, e la risposta è cambiata con ogni lingua in cui è stata pronunciata.","c'è una bellezza discreta nel non sapere ancora — quello spazio è il luogo dove cresce il pensiero."],close:["Così finisce il canto; il tuo comincia adesso.","E l'arena, come sempre, applaude la domanda, non la risposta.","Punto, e da capo."]},
  analist:{name:"L'Analista (demo)",open:["Strutturiamo.","Scompongo il problema in tre parti.","Con metodo:"],mid:["Prima le definizioni: senza termini chiari, ogni conclusione è fragile. Poi i dati: ciò che sappiamo, ciò che soltanto supponiamo. Infine l'inferenza: il passo più piccolo che collega l'uno all'altro.","Un'ipotesi di lavoro deve essere falsificabile; altrimenti parliamo di gusti, non di fatti. Verifico le premesse una per una e segnalo esplicitamente l'incertezza.","Esistono almeno due letture plausibili. Le confronto in base alle previsioni che fanno, non in base a quanto suonano eleganti."],close:["Conclusione provvisoria, aperta a revisione.","C.V.D. — con un asterisco.","I dati nuovi battono le vecchie opinioni."]},
  sceptic:{name:"Lo Scettico (demo)",open:["Un momento.","Prima della risposta, un'obiezione.","Hm — la domanda nasconde una premessa."],mid:["Chi dice che la domanda sia posta bene? Spesso la risposta sbagliata nasce da una domanda accettata troppo in fretta.","Vorrei fonti, non impressioni. Fino ad allora, la risposta onesta è «non ne sappiamo ancora abbastanza».","Diffida di ciò che sembra ovvio: l'ovvio è il luogo dove si nascondono gli errori più antichi."],close:["Il dubbio resta il miglior strumento dell'arena.","Verificami. Sul serio.","Non credermi sulla parola — il messaggio è tutto qui."]}},
 es:{laconic:{name:"Lacónico (demo)",open:["En breve:","Directo:","La esencia:"],mid:["Aquí solo importa una cosa — el núcleo de la pregunta.","El resto es ruido; quédate solo con lo que puedas verificar.","Si no cabe en una frase, aún no se ha entendido."],close:["Eso es todo.","El resto queda como ejercicio para el lector.","Sencillo."]},
  rapsod:{name:"El Rapsoda (demo)",open:["Imagina por un momento:","Escucha:","Hay una vieja historia dentro de tu pregunta —"],mid:["cada idea es un grano de arena en la arena del tiempo, y sin embargo la arena guarda las huellas de los gladiadores.","lo que tú preguntas, otros lo preguntaron junto a otros fuegos, y la respuesta cambió con cada lengua en que fue pronunciada.","hay una belleza discreta en no saber todavía — ese espacio es el lugar donde crece el pensamiento."],close:["Así termina el canto; el tuyo empieza ahora.","Y la arena, como siempre, aplaude la pregunta, no la respuesta.","Punto final, y otra vez desde el principio."]},
  analist:{name:"El Analista (demo)",open:["Estructuremos.","Descompongo el problema en tres partes.","Con método:"],mid:["Primero las definiciones: sin términos claros, toda conclusión es frágil. Luego los datos: lo que sabemos, lo que solo suponemos. Por último, la inferencia: el paso más pequeño que une lo uno con lo otro.","Una hipótesis de trabajo debe ser falsable; si no, discutimos gustos, no hechos. Compruebo las premisas una a una y señalo explícitamente la incertidumbre.","Hay al menos dos lecturas plausibles. Las comparo por las predicciones que hacen, no por lo elegantes que suenen."],close:["Conclusión provisional, abierta a revisión.","Q. E. D. — con asterisco.","Los datos nuevos vencen a las opiniones viejas."]},
  sceptic:{name:"El Escéptico (demo)",open:["Un momento.","Antes de la respuesta, una objeción.","Hm — la pregunta esconde una premisa."],mid:["¿Quién dice que la pregunta está bien planteada? A menudo la respuesta equivocada nace de una pregunta aceptada demasiado deprisa.","Querría fuentes, no impresiones. Hasta entonces, la respuesta honesta es «aún no sabemos lo suficiente».","Cuidado con lo obvio: lo obvio es donde se esconden los errores más antiguos."],close:["La duda sigue siendo el mejor instrumento de la arena.","Compruébame. En serio.","No me creas bajo palabra — ese es todo el mensaje."]}},
 pt:{laconic:{name:"Lacónico (demo)",open:["Em suma:","Diretamente:","A essência:"],mid:["Aqui só uma coisa importa — o cerne da pergunta.","O resto é ruído; guarda apenas o que podes verificar.","Se não cabe numa frase, ainda não foi compreendido."],close:["É isso.","O resto fica como exercício para o leitor.","Simples."]},
  rapsod:{name:"O Rapsodo (demo)",open:["Imagina por um instante:","Escuta:","Há uma velha história dentro da tua pergunta —"],mid:["cada ideia é um grão de areia na arena do tempo, e no entanto a areia guarda os passos dos gladiadores.","o que perguntas, outros perguntaram junto a outras fogueiras, e a resposta mudou com cada língua em que foi dita.","há uma beleza discreta em ainda não saber — esse espaço é o lugar onde o pensamento cresce."],close:["Assim termina o canto; o teu começa agora.","E a arena, como sempre, aplaude a pergunta, não a resposta.","Ponto final, e outra vez do início."]},
  analist:{name:"O Analista (demo)",open:["Vamos estruturar.","Decomponho o problema em três partes.","Com método:"],mid:["Primeiro as definições: sem termos claros, qualquer conclusão é frágil. Depois os dados: o que sabemos, o que apenas supomos. Por fim, a inferência: o passo mais pequeno que liga uma coisa à outra.","Uma hipótese de trabalho tem de ser falseável; caso contrário, discutimos gostos, não factos. Verifico as premissas uma a uma e assinalo explicitamente a incerteza.","Existem pelo menos duas leituras plausíveis. Comparo-as pelas previsões que fazem, não pela elegância com que soam."],close:["Conclusão provisória, aberta a revisão.","C.Q.D. — com asterisco.","Dados novos vencem opiniões velhas."]},
  sceptic:{name:"O Cético (demo)",open:["Espera um pouco.","Antes da resposta, uma objeção.","Hm — a pergunta esconde uma premissa."],mid:["Quem diz que a pergunta está bem formulada? Muitas vezes a resposta errada nasce de uma pergunta aceite depressa demais.","Queria fontes, não impressões. Até lá, a resposta honesta é «ainda não sabemos o suficiente».","Cuidado com o óbvio: o óbvio é onde se escondem os erros mais antigos."],close:["A dúvida continua a ser o melhor instrumento da arena.","Verifica-me. A sério.","Não acredites na minha palavra — a mensagem é toda essa."]}},
 de:{laconic:{name:"Der Wortkarge (Demo)",open:["Kurz gesagt:","Direkt:","Der Kern:"],mid:["Hier zählt nur eines — der Kern der Frage.","Der Rest ist Rauschen; behalte nur, was du überprüfen kannst.","Passt es nicht in einen Satz, ist es noch nicht verstanden."],close:["Das war's.","Der Rest bleibt dem Leser als Übung.","Einfach."]},
  rapsod:{name:"Der Rhapsode (Demo)",open:["Stell dir einen Augenblick vor:","Hör zu:","In deiner Frage steckt eine alte Geschichte —"],mid:["jede Idee ist ein Sandkorn in der Arena der Zeit, und doch bewahrt der Sand die Schritte der Gladiatoren.","was du fragst, haben andere an anderen Feuern gefragt, und die Antwort wandelte sich mit jeder Sprache, in der sie gesprochen wurde.","es liegt eine stille Schönheit darin, noch nicht zu wissen — in diesem Raum wächst das Denken."],close:["So endet das Lied; deins beginnt jetzt.","Und die Arena applaudiert wie immer der Frage, nicht der Antwort.","Punkt, und noch einmal von vorn."]},
  analist:{name:"Der Analytiker (Demo)",open:["Strukturieren wir.","Ich zerlege das Problem in drei Teile.","Methodisch:"],mid:["Zuerst die Definitionen: Ohne klare Begriffe ist jede Schlussfolgerung brüchig. Dann die Daten: was wir wissen, was wir nur annehmen. Zuletzt der Schluss: der kleinste Schritt, der das eine mit dem anderen verbindet.","Eine Arbeitshypothese muss falsifizierbar sein; sonst streiten wir über Geschmack, nicht über Tatsachen. Ich prüfe die Prämissen eine nach der anderen und kennzeichne Unsicherheit ausdrücklich.","Es gibt mindestens zwei plausible Lesarten. Ich vergleiche sie nach den Vorhersagen, die sie machen, nicht danach, wie elegant sie klingen."],close:["Vorläufiges Ergebnis, offen für Revision.","q. e. d. — mit Sternchen.","Neue Daten schlagen alte Meinungen."]},
  sceptic:{name:"Der Skeptiker (Demo)",open:["Moment mal.","Vor der Antwort ein Einwand.","Hm — die Frage verbirgt eine Prämisse."],mid:["Wer sagt, dass die Frage richtig gestellt ist? Falsche Antworten entstehen oft aus Fragen, die zu schnell akzeptiert wurden.","Ich wünschte mir Quellen statt Eindrücken. Bis dahin lautet die ehrliche Antwort: „Wir wissen noch nicht genug“.","Vorsicht vor dem Offensichtlichen: Dort verstecken sich die ältesten Irrtümer."],close:["Der Zweifel bleibt das beste Werkzeug der Arena.","Überprüf mich. Im Ernst.","Glaub mir nicht aufs Wort — das ist die ganze Botschaft."]}},
 hu:{laconic:{name:"A Szűkszavú (demó)",open:["Röviden:","Egyenesen:","A lényeg:"],mid:["Itt csak egy dolog számít — a kérdés magja.","A többi zaj; csak azt tartsd meg, amit ellenőrizni tudsz.","Ha nem fér bele egy mondatba, akkor még nem értették meg."],close:["Ennyi.","A többi gyakorlatnak marad az olvasóra.","Egyszerű."]},
  rapsod:{name:"A Rapszódosz (demó)",open:["Képzeld el egy pillanatra:","Hallgasd:","Egy régi történet rejtőzik a kérdésedben —"],mid:["minden gondolat egy homokszem az idő arénájában, és mégis őrzi a homok a gladiátorok lépteit.","amit te kérdezel, mások is kérdezték más tüzek mellett, és a válasz minden nyelvvel megváltozott, amelyen kimondták.","van egy csendes szépség abban, hogy még nem tudjuk — ez a tér az, ahol a gondolkodás növekszik."],close:["Így ér véget az ének; a tiéd most kezdődik.","És az aréna, mint mindig, a kérdésnek tapsol, nem a válasznak.","Pont, és kezdjük elölről."]},
  analist:{name:"Az Elemző (demó)",open:["Rendszerezzük.","A problémát három részre bontom.","Módszeresen:"],mid:["Először a definíciók: világos fogalmak nélkül minden következtetés törékeny. Aztán az adatok: mit tudunk, és mit csak feltételezünk. Végül a következtetés: a legkisebb lépés, amely az egyiket a másikhoz köti.","A munkahipotézisnek cáfolhatónak kell lennie; különben ízlésről vitatkozunk, nem tényekről. Egyenként ellenőrzöm az előfeltevéseket, és kifejezetten jelzem a bizonytalanságot.","Legalább két hihető olvasat létezik. Azt hasonlítom össze, milyen előrejelzéseket tesznek, nem azt, mennyire hangzanak elegánsan."],close:["Ideiglenes következtetés, felülvizsgálatra nyitva.","Q.E.D. — csillaggal.","Az új adat felülírja a régi véleményt."]},
  sceptic:{name:"A Szkeptikus (demó)",open:["Várj egy kicsit.","A válasz előtt egy ellenvetés.","Hm — a kérdés elrejt egy előfeltevést."],mid:["Ki mondja, hogy a kérdés jól van feltéve? A rossz válasz gyakran egy túl gyorsan elfogadott kérdésből ered.","Forrásokat szeretnék, nem benyomásokat. Addig az őszinte válasz: „még nem tudunk eleget”.","Vigyázz az magától értetődővel: a legrégebbi tévedések éppen ott rejtőznek."],close:["A kétely továbbra is az aréna legjobb eszköze.","Ellenőrizz le. Komolyan.","Ne higgy a szavamnak — ez az egész üzenet."]}}

ghput più rapido (~2000 tok/s) · limiti giornalieri non verificati.","Google AI Studio":"Free tier · Gemini Flash ~20 req/giorno, Flash-Lite ~500/giorno, Gemma ~14400/giorno · fuori dall'UE i dati possono essere usati per l'addestramento · verifica gli ID esatti in AI Studio.","Mistral La Plateforme":"Free tier (Experiment) · richiede verifica telefonica e consenso all'addestramento sui dati · limiti generosi per modello.","NVIDIA NIM":"Gratuito con un account NVIDIA (verifica telefonica) · 40 req/min · contesto talvolta limitato.","Cohere":"Chiave di prova gratuita · 20 req/min, 1000 req/mese (quota condivisa).","HuggingFace Inference":"Token HF gratuito · ~0,10 $/mese di crediti Inference Providers · gli ID sono repository HF.","Cloudflare Workers AI":"10.000 neuroni/giorno gratis · IMPORTANTE: dopo l'aggiunta, modifica il modello e sostituisci CONT_ID nella Base URL con il tuo Account ID Cloudflare.","Z.ai (Zhipu)":"I modelli Flash sono gratuiti con una chiave · limiti per modello.","ModelScope · 魔搭 (Alibaba)":"Gratuito: 2000 chiamate/giorno in totale, max 500/modello (100/giorno per i grandi DeepSeek) · richiede un account Alibaba con verifica dell'identità · Qwen3.5 compare qui per primo — usa ⟳ per l'elenco completo.","SiliconFlow · 硅基流动":"Modelli piccoli gratuiti in modo permanente + ~20 M di token alla registrazione (account CN; internazionale: api.siliconflow.com, ~1 $ di credito) · l'elenco dei modelli a 0 ¥ ruota — usa ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite gratuito + ~100 M di token all'attivazione del servizio · account Tencent Cloud.","Baidu Qianfan · 百度千帆":"ERNIE Speed e Lite gratuiti · account Baidu Cloud.","iFlytek Spark · 讯飞星火":"Spark Lite gratuito e illimitato · la chiave si scrive APIKey:APISecret (con i due punti in mezzo).","Moonshot Kimi · 月之暗面":"Crediti di prova alla registrazione · endpoint CN: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Prova: 1.000.000 di token per modello, 90 giorni (endpoint Singapore).","În browser · WebLLM (WebGPU)":"L'IA gira direttamente in questa pagina, sulla tua GPU, tramite WebGPU — zero server, zero chiavi. Al primo utilizzo scarica il modello (0,6–2 GB, poi resta nella cache del browser) e la libreria del modello (.wasm, commit fissato, verificata con SHA-256). La libreria WebLLM stessa è inclusa in vendor/ — facoltativo e attivato solo da te.","LM Studio (local)":"Avvia il server dalla scheda Developer e attiva CORS nelle impostazioni del server · ⟳ elenca i modelli caricati — usalo, l'ID statico qui sotto è solo indicativo.","Jan (local)":"Attiva l'API Server nelle impostazioni di Jan (con CORS) · ⟳ elenca i modelli installati.","llama.cpp / llamafile (local)":"«llama-server -m model.gguf» oppure doppio clic su un llamafile · il server accetta qualsiasi ID di modello · CORS è consentito per impostazione predefinita.","GPT4All (local)":"Attiva «Local API Server» in Settings · ⟳ elenca i modelli.","KoboldCpp (local)":"Endpoint compatibile OpenAI attivo per impostazione predefinita sulla porta 5001.","vLLM (local/server)":"«vllm serve <model>» · per l'accesso dal browser avvialo con --allowed-origins '[\"*\"]'.","AI încorporat în browser · Gemini Nano":"Prompt API di Chrome/Edge — il modello è gestito e scaricato una sola volta dal browser, gira interamente in locale, zero librerie esterne. Se il badge ⚡ mostra ✗, attiva l'IA integrata dalle impostazioni/flag del browser.","Transformers.js · WASM/WebGPU":"Esegue ONNX nella pagina — anche SENZA WebGPU (ripiega su WASM), quindi funziona su quasi ogni browser. Il primo utilizzo scarica il file ONNX Runtime (.wasm, verificato con SHA-256) e il modello da HuggingFace, poi li mette in cache. La libreria Transformers.js è in vendor/.","LocalAI (local)":"Server compatibile OpenAI completo (testo/immagine/audio) · ATTENZIONE: la porta 8080 è anche quella predefinita di llama.cpp — cambia una delle due se li esegui entrambi · ⟳ elenca la galleria installata.","Text Generation WebUI · oobabooga (local)":"Avvialo con --api (e --api-cors se serve) · porta predefinita 5000.","TabbyAPI · ExLlamaV2 (local)":"Inferenza EXL2 veloce su GPU · stessa porta 5000 di oobabooga — eseguine solo uno o cambia la porta.","SGLang (local/server)":"«python -m sglang.launch_server --model-path <model>» · porta predefinita 30000.","MLX · Apple Silicon (local)":"«mlx_lm.server --model <model>» su Mac M1–M4 · porta predefinita 8080 (in conflitto con llama.cpp/LocalAI se girano insieme).","Aphrodite Engine (local/server)":"Motore di serving ad alto throughput · porta predefinita 2242.","Cortex (local)":"Il motore dietro Jan, utilizzabile in modo autonomo («cortex run <model>») · porta predefinita 39281.","Xinference (local/server)":"«xinference-local» · porta predefinita 9997 · serve LLM/embeddings/rerank.","FastChat (local/server)":"Il server compatibile OpenAI del team LMSYS (i creatori dell'arena originale) · porta 8000 — in conflitto con vLLM se girano entrambi.","LiteLLM Proxy (local · ruter)":"Router locale verso oltre 100 provider — tutto ciò che hai configurato in litellm compare qui tramite ⟳ · porta predefinita 4000.","Docker Model Runner (local)":"«docker model run ai/<model>» da Docker Desktop · endpoint compatibile OpenAI su 12434 · attiva l'accesso TCP host nelle impostazioni di Docker.","Foundry Local · Microsoft (local)":"«foundry model run <model>» — esegue in locale i modelli del catalogo Foundry (Phi, Qwen, DeepSeek…) con accelerazione NPU/GPU · la porta è dinamica: verificala con «foundry service status» e correggi la Base URL se diversa.","Lemonade · AMD (local · GPU+NPU)":"Il server locale di AMD: LLM + Stable Diffusion + Whisper + TTS sotto un unico endpoint compatibile OpenAI, con esecuzione ibrida GPU+NPU (Ryzen AI) · verifica la porta mostrata all'avvio.","Ollama · biblioteca 2026 (local)":"I modelli open-weight più recenti eseguibili in locale tramite «ollama pull <id>» (Ollama avviato con OLLAMA_ORIGINS=*) · su Apple Silicon Ollama ora usa MLX in modo nativo · i chip presuppongono che il modello sia già scaricato — ⚡ te lo conferma.","România · OpenLLM-Ro (local)":"Gli unici LLM rumeni sono open source, senza API ospitata — li esegui in locale: installa Ollama, poi «ollama pull hf.co/<repo>» (funziona se il repository ha GGUF; RoLlama-3.2-1B è quantizzato a 4 bit proprio per questo; per gli altri cerca la conversione GGUF della community su HuggingFace). IMPORTANTE per il browser: avvia Ollama con OLLAMA_ORIGINS=* (altrimenti CORS blocca la pagina). ⟳ elenca ciò che hai già installato in locale.","SEA-LION · Singapore (AI Singapore)":"Chiave gratuita · 10 req/min · modelli sovrani per le lingue del Sud-est asiatico.","Sarvam · India":"1000 ₹ di crediti gratuiti alla registrazione, senza carta, senza scadenza · 22 lingue indiane · Sarvam-30B/105B (2026) compaiono tramite ⟳.","Fanar · Qatar (QCRI)":"API gratuita su richiesta (modulo per sviluppatori) · la prima IA generativa araba del Qatar.","AI21 · Israel":"Crediti di prova: 10 $ / 3 mesi · la famiglia Jamba (SSM-Transformer).","Upstage · Coreea de Sud":"Crediti di prova: 10 $ / 3 mesi · i modelli Solar.","Maritaca · Brazilia":"Crediti gratuiti alla registrazione · la famiglia Sabiá, specializzata in portoghese.","Lume · modele naționale open-source (local)":"Modelli sovrani senza API ospitata gratuita — li esegui in locale con Ollama (avviato con OLLAMA_ORIGINS=*): «ollama pull falcon3» oppure «ollama pull hf.co/<repo>» (richiede GGUF; altrimenti cerca la conversione della community). ⟳ elenca ciò che hai installato.","Anthropic · Claude":"A pagamento, con la tua chiave · CORS supportato ufficialmente dal browser (header dedicato, già incluso nell'app).","OpenAI":"A pagamento, con la tua chiave · verifica gli ID esatti con ⟳ dopo aver inserito la chiave.","xAI · Grok":"A pagamento, con la tua chiave · ⟳ per l'elenco esatto.","DeepSeek (direct)":"A pagamento ma molto economico — il passo più accessibile oltre il gratuito.","Perplexity · Sonar":"A pagamento, con la tua chiave · modelli con ricerca web integrata nella risposta.","LLM7.io":"Gateway gratuito senza chiave (token facoltativo per limiti più alti) · affidabilità variabile — verifica con ⚡ e usa ⟳ per l'elenco reale.","Together AI":"Crediti di prova alla registrazione · ampio catalogo open-weight — ⟳ dopo la chiave.","Fireworks AI":"Crediti di prova: 1 $ · gli ID hanno il prefisso accounts/fireworks/models/.","Nebius Token Factory":"Crediti di prova: 1 $ · se l'endpoint è diverso, prendilo dalla console e correggi la Base URL.","Novita AI":"Crediti di prova: 0,5 $ validi per un anno.","Hyperbolic":"Crediti di prova: 1 $.","Inference.net":"Crediti di prova: 1 $ (25 $ con il questionario via e-mail) · ⟳ per gli ID esatti.","SambaNova":"Crediti di prova: 5 $ / 3 mesi · inferenza molto veloce.","Scaleway":"Crediti di prova: 1.000.000 di token gratuiti · hosting UE."},"groups":{"În browser · WebLLM (WebGPU)":"Nel browser · WebLLM (WebGPU)","AI încorporat în browser · Gemini Nano":"IA integrata nel browser · Gemini Nano","România · OpenLLM-Ro (local)":"Romania · OpenLLM-Ro (locale)","Lume · modele naționale open-source (local)":"Mondo · modelli nazionali open source (locale)"},"frag":{"în browser":"nel browser","încorporat în browser":"integrato nel browser","Modelul încărcat":"Modello caricato","Modelul servit":"Modello servito","Modelul lansat":"Modello avviato","Modelul rulat":"Modello in esecuzione","Modelele găzduite":"Modelli ospitati","Arabia Saudită":"Arabia Saudita","România":"Romania"}},"es":{"notes":{"Pollinations":"La antigua API (text.pollinations.ai) quedó obsoleta y devuelve 402 — la nueva exige una clave GRATUITA de enter.pollinations.ai: usa una clave pk_ (publishable), diseñada explícitamente para ser segura en el navegador · nivel gratuito con Pollen recargado periódicamente · ⟳ funciona también sin clave (el catálogo es público).","Kilo Gateway":"Los modelos :free funcionan sin cuenta · 200 req/hora por IP · los prompts pueden usarse para entrenamiento · si recibes «red/CORS bloqueado», la pasarela rechaza las llamadas desde el navegador en tu red — enrútala mediante un LiteLLM Proxy local.","OpenCode Zen":"Clave gratuita, sin tarjeta · modelos gratuitos seleccionados para programación · los datos del periodo gratuito pueden usarse para mejorar los modelos.","OpenRouter":"Clave gratuita, sin tarjeta · 20 req/min, 50 req/día (1000/día tras una recarga única de 10 $) · los modelos :free rotan con frecuencia.","Groq":"Free tier, sin tarjeta · muy rápido (LPU) · ~1000 req/día en los modelos grandes (límites reducidos en 2026).","Cerebras":"Sin nivel gratuito permanente confirmado: cerebras.ai/pricing indica un crédito promocional único de 5 $ (requiere método de pago, caduca a los 30 días) · el mayor rendimiento (~2000 tok/s) · límites diarios no verificados.","Google AI Studio":"Free tier · Gemini Flash ~20 req/día, Flash-Lite ~500/día, Gemma ~14400/día · fuera de la UE los datos pueden usarse para entrenamiento · comprueba los ID exactos en AI Studio.","Mistral La Plateforme":"Free tier (Experiment) · exige verificación por teléfono y aceptar el entrenamiento con datos · límites generosos por modelo.","NVIDIA NIM":"Gratis con una cuenta NVIDIA (verificación por teléfono) · 40 req/min · contexto a veces limitado.","Cohere":"Clave de prueba gratuita · 20 req/min, 1000 req/mes (cuota compartida).","HuggingFace Inference":"Token HF gratuito · ~0,10 $/mes en créditos de Inference Providers · los ID son repositorios de HF.","Cloudflare Workers AI":"10.000 neuronas/día gratis · IMPORTANTE: tras añadirlo, edita el modelo y sustituye CONT_ID en la Base URL por tu Account ID de Cloudflare.","Z.ai (Zhipu)":"Los modelos Flash son gratuitos con clave · límites por modelo.","ModelScope · 魔搭 (Alibaba)":"Gratis: 2000 llamadas/día en total, máx. 500/modelo (100/día en los DeepSeek grandes) · exige una cuenta de Alibaba con verificación de identidad · Qwen3.5 aparece aquí primero — usa ⟳ para la lista completa.","SiliconFlow · 硅基流动":"Modelos pequeños gratuitos de forma permanente + ~20 M de tokens al registrarte (cuenta CN; internacional: api.siliconflow.com, ~1 $ de crédito) · la lista de modelos de 0 ¥ rota — usa ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite gratuito + ~100 M de tokens al activar el servicio · cuenta de Tencent Cloud.","Baidu Qianfan · 百度千帆":"ERNIE Speed y Lite gratuitos · cuenta de Baidu Cloud.","iFlytek Spark · 讯飞星火":"Spark Lite gratuito e ilimitado · la clave se escribe APIKey:APISecret (con dos puntos entre ambas).","Moonshot Kimi · 月之暗面":"Créditos de prueba al registrarte · endpoint CN: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Prueba: 1.000.000 de tokens por modelo, 90 días (endpoint de Singapur).","În browser · WebLLM (WebGPU)":"La IA se ejecuta en esta misma página, en tu GPU, mediante WebGPU — cero servidor, cero clave. En el primer uso descarga el modelo (0,6–2 GB, luego queda en la caché del navegador) y la biblioteca del modelo (.wasm, commit fijado, verificada con SHA-256). La propia biblioteca WebLLM viene incluida en vendor/ — opcional y activada solo por ti.","LM Studio (local)":"Inicia el servidor desde la pestaña Developer y activa CORS en los ajustes del servidor · ⟳ lista los modelos cargados — úsalo, el ID estático de abajo es solo orientativo.","Jan (local)":"Activa el API Server en los ajustes de Jan (con CORS) · ⟳ lista los modelos instalados.","llama.cpp / llamafile (local)":"«llama-server -m model.gguf» o doble clic en un llamafile · el servidor acepta cualquier ID de modelo · CORS está permitido por defecto.","GPT4All (local)":"Activa «Local API Server» en Settings · ⟳ lista los modelos.","KoboldCpp (local)":"Endpoint compatible con OpenAI activo por defecto en el puerto 5001.","vLLM (local/server)":"«vllm serve <model>» · para acceder desde el navegador, inícialo con --allowed-origins '[\"*\"]'.","AI încorporat în browser · Gemini Nano":"Prompt API de Chrome/Edge — el navegador gestiona y descarga el modelo una sola vez, se ejecuta totalmente en local, cero bibliotecas externas. Si la insignia ⚡ muestra ✗, activa la IA integrada en los ajustes/flags del navegador.","Transformers.js · WASM/WebGPU":"Ejecuta ONNX en la página — incluso SIN WebGPU (recurre a WASM), así que funciona en casi cualquier navegador. El primer uso descarga el archivo ONNX Runtime (.wasm, verificado con SHA-256) y el modelo de HuggingFace, y luego los guarda en caché. La biblioteca Transformers.js está en vendor/.","LocalAI (local)":"Servidor completo compatible con OpenAI (texto/imagen/audio) · ATENCIÓN: el puerto 8080 es también el predeterminado de llama.cpp — cambia uno de los dos si ejecutas ambos · ⟳ lista la galería instalada.","Text Generation WebUI · oobabooga (local)":"Inícialo con --api (y --api-cors si hace falta) · puerto predeterminado 5000.","TabbyAPI · ExLlamaV2 (local)":"Inferencia EXL2 rápida en GPU · el mismo puerto 5000 que oobabooga — ejecuta solo uno o cambia el puerto.","SGLang (local/server)":"«python -m sglang.launch_server --model-path <model>» · puerto predeterminado 30000.","MLX · Apple Silicon (local)":"«mlx_lm.server --model <model>» en Mac M1–M4 · puerto predeterminado 8080 (en conflicto con llama.cpp/LocalAI si se ejecutan a la vez).","Aphrodite Engine (local/server)":"Motor de servicio de alto rendimiento · puerto predeterminado 2242.","Cortex (local)":"El motor detrás de Jan, utilizable por separado («cortex run <model>») · puerto predeterminado 39281.","Xinference (local/server)":"«xinference-local» · puerto predeterminado 9997 · sirve LLM/embeddings/rerank.","FastChat (local/server)":"El servidor compatible con OpenAI del equipo LMSYS (los creadores de la arena original) · puerto 8000 — en conflicto con vLLM si se ejecutan ambos.","LiteLLM Proxy (local · ruter)":"Enrutador local hacia más de 100 proveedores — todo lo que hayas configurado en litellm aparece aquí mediante ⟳ · puerto predeterminado 4000.","Docker Model Runner (local)":"«docker model run ai/<model>» desde Docker Desktop · endpoint compatible con OpenAI en 12434 · biá, especializada en portugués.","Lume · modele naționale open-source (local)":"Modelos soberanos sin API alojada gratuita — los ejecutas en local con Ollama (iniciado con OLLAMA_ORIGINS=*): «ollama pull falcon3» o «ollama pull hf.co/<repo>» (exige GGUF; si no, busca la conversión de la comunidad). ⟳ lista lo que tienes instalado.","Anthropic · Claude":"De pago, con tu clave · CORS compatible oficialmente desde el navegador (cabecera dedicada, ya incluida en la aplicación).","OpenAI":"De pago, con tu clave · comprueba los ID exactos con ⟳ tras introducir la clave.","xAI · Grok":"De pago, con tu clave · ⟳ para la lista exacta.","DeepSeek (direct)":"De pago pero muy barato — el paso más asequible más allá de lo gratuito.","Perplexity · Sonar":"De pago, con tu clave · modelos con búsqueda web integrada en la respuesta.","LLM7.io":"Pasarela gratuita sin clave (token opcional para límites mayores) · fiabilidad variable — comprueba con ⚡ y usa ⟳ para la lista real.","Together AI":"Créditos de prueba al registrarte · gran catálogo open-weight — ⟳ tras la clave.","Fireworks AI":"Créditos de prueba: 1 $ · los ID llevan el prefijo accounts/fireworks/models/.","Nebius Token Factory":"Créditos de prueba: 1 $ · si el endpoint difiere, tómalo de la consola y corrige la Base URL.","Novita AI":"Créditos de prueba: 0,5 $ válidos durante un año.","Hyperbolic":"Créditos de prueba: 1 $.","Inference.net":"Créditos de prueba: 1 $ (25 $ con el cuestionario por correo) · ⟳ para los ID exactos.","SambaNova":"Créditos de prueba: 5 $ / 3 meses · inferencia muy rápida.","Scaleway":"Créditos de prueba: 1.000.000 de tokens gratis · alojamiento en la UE."},"groups":{"În browser · WebLLM (WebGPU)":"En el navegador · WebLLM (WebGPU)","AI încorporat în browser · Gemini Nano":"IA integrada en el navegador · Gemini Nano","România · OpenLLM-Ro (local)":"Rumanía · OpenLLM-Ro (local)","Lume · modele naționale open-source (local)":"Mundo · modelos nacionales de código abierto (local)"},"frag":{"în browser":"en el navegador","încorporat în browser":"integrado en el navegador","Modelul încărcat":"Modelo cargado","Modelul servit":"Modelo servido","Modelul lansat":"Modelo lanzado","Modelul rulat":"Modelo en ejecución","Modelele găzduite":"Modelos alojados","Arabia Saudită":"Arabia Saudí","România":"Rumanía"}},"pt":{"notes":{"Pollinations":"A antiga API (text.pollinations.ai) foi descontinuada e devolve 402 — a nova exige uma chave GRATUITA em enter.pollinations.ai: usa uma chave pk_ (publishable), concebida explicitamente para ser segura no navegador · nível gratuito com Pollen recarregado periodicamente · ⟳ funciona também sem chave (o catálogo é público).","Kilo Gateway":"Os modelos :free funcionam sem conta · 200 pedidos/hora por IP · os prompts podem ser usados para treino · se receberes «rede/CORS bloqueado», o gateway recusa chamadas do navegador na tua rede — encaminha-o por um LiteLLM Proxy local.","OpenCode Zen":"Chave gratuita, sem cartão · modelos gratuitos selecionados para programação · os dados do período gratuito podem ser usados para melhorar os modelos.","OpenRouter":"Chave gratuita, sem cartão · 20 pedidos/min, 50 pedidos/dia (1000/dia após um carregamento único de 10 $) · os modelos :free mudam com frequência.","Groq":"Free tier, sem cartão · muito rápido (LPU) · ~1000 pedidos/dia nos modelos grandes (limites reduzidos em 2026).","Cerebras":"Sem nível gratuito permanente confirmado: cerebras.ai/pricing indica um crédito promocional único de 5 $ (exige método de pagamento, expira em 30 dias) · o maior débito (~2000 tok/s) · limites diários não verificados.","Google AI Studio":"Free tier · Gemini Flash ~20 pedidos/dia, Flash-Lite ~500/dia, Gemma ~14400/dia · fora da UE os dados podem ser usados para treino · verifica os IDs exatos no AI Studio.","Mistral La Plateforme":"Free tier (Experiment) · exige verificação por telefone e acordo de treino com dados · limites generosos por modelo.","NVIDIA NIM":"Gratuito com uma conta NVIDIA (verificação por telefone) · 40 pedidos/min · contexto por vezes limitado.","Cohere":"Chave de teste gratuita · 20 pedidos/min, 1000 pedidos/mês (quota partilhada).","HuggingFace Inference":"Token HF gratuito · ~0,10 $/mês em créditos Inference Providers · os IDs são repositórios HF.","Cloudflare Workers AI":"10.000 neurónios/dia grátis · IMPORTANTE: depois de adicionar, edita o modelo e substitui CONT_ID na Base URL pelo teu Account ID da Cloudflare.","Z.ai (Zhipu)":"Os modelos Flash são gratuitos com chave · limites por modelo.","ModelScope · 魔搭 (Alibaba)":"Grátis: 2000 chamadas/dia no total, máx. 500/modelo (100/dia nos DeepSeek grandes) · exige uma conta Alibaba com verificação de identidade · o Qwen3.5 aparece aqui primeiro — usa ⟳ para a lista completa.","SiliconFlow · 硅基流动":"Modelos pequenos gratuitos em permanência + ~20 M de tokens no registo (conta CN; internacional: api.siliconflow.com, ~1 $ de crédito) · a lista de modelos a 0 ¥ roda — usa ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite gratuito + ~100 M de tokens na ativação do serviço · conta Tencent Cloud.","Baidu Qianfan · 百度千帆":"ERNIE Speed e Lite gratuitos · conta Baidu Cloud.","iFlytek Spark · 讯飞星火":"Spark Lite gratuito e ilimitado · a chave escreve-se APIKey:APISecret (com dois pontos entre as duas).","Moonshot Kimi · 月之暗面":"Créditos de teste no registo · endpoint CN: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Teste: 1.000.000 de tokens por modelo, 90 dias (endpoint de Singapura).","În browser · WebLLM (WebGPU)":"A IA corre nesta própria página, na tua GPU, através de WebGPU — zero servidor, zero chave. Na primeira utilização descarrega o modelo (0,6–2 GB, depois fica na cache do navegador) e a biblioteca do modelo (.wasm, commit fixo, verificada com SHA-256). A própria biblioteca WebLLM está incluída em vendor/ — opcional e acionada só por ti.","LM Studio (local)":"Inicia o servidor no separador Developer e ativa o CORS nas definições do servidor · ⟳ lista os modelos carregados — usa-o, o ID estático abaixo é apenas Cortex (local)":"O motor por trás do Jan, utilizável em separado («cortex run <model>») · porta predefinida 39281.","Xinference (local/server)":"«xinference-local» · porta predefinida 9997 · serve LLM/embeddings/rerank.","FastChat (local/server)":"O servidor compatível com OpenAI da equipa LMSYS (os criadores da arena original) · porta 8000 — conflito com o vLLM se correrem ambos.","LiteLLM Proxy (local · ruter)":"Router local para mais de 100 fornecedores — tudo o que configuraste no litellm aparece aqui através de ⟳ · porta predefinida 4000.","Docker Model Runner (local)":"«docker model run ai/<model>» a partir do Docker Desktop · endpoint compatível com OpenAI em 12434 · ativa o acesso TCP do host nas definições do Docker.","Foundry Local · Microsoft (local)":"«foundry model run <model>» — executa localmente modelos do catálogo Foundry (Phi, Qwen, DeepSeek…) com aceleração NPU/GPU · a porta é dinâmica: verifica-a com «foundry service status» e corrige a Base URL se diferir.","Lemonade · AMD (local · GPU+NPU)":"O servidor local da AMD: LLM + Stable Diffusion + Whisper + TTS sob um único endpoint compatível com OpenAI, com execução híbrida GPU+NPU (Ryzen AI) · verifica a porta apresentada no arranque.","Ollama · biblioteca 2026 (local)":"Os modelos open-weight mais recentes executáveis em local com «ollama pull <id>» (Ollama iniciado com OLLAMA_ORIGINS=*) · em Apple Silicon o Ollama usa agora o MLX nativamente · os chips assumem que o modelo já foi descarregado — o ⚡ confirma-to.","România · OpenLLM-Ro (local)":"Os únicos LLM romenos são de código aberto, sem API alojada — executas-os em local: instala o Ollama e depois «ollama pull hf.co/<repo>» (funciona se o repositório tiver GGUF; o RoLlama-3.2-1B está quantizado a 4 bits precisamente para isto; para os restantes procura a conversão GGUF da comunidade no HuggingFace). IMPORTANTE para o navegador: inicia o Ollama com OLLAMA_ORIGINS=* (caso contrário o CORS bloqueia a página). ⟳ lista o que já tens instalado em local.","SEA-LION · Singapore (AI Singapore)":"Chave gratuita · 10 pedidos/min · modelos soberanos para as línguas do Sudeste Asiático.","Sarvam · India":"1000 ₹ em créditos gratuitos no registo, sem cartão, sem expirar · 22 línguas indianas · Sarvam-30B/105B (2026) aparecem através de ⟳.","Fanar · Qatar (QCRI)":"API gratuita a pedido (formulário para programadores) · a primeira IA generativa árabe do Catar.","AI21 · Israel":"Créditos de teste: 10 $ / 3 meses · a família Jamba (SSM-Transformer).","Upstage · Coreea de Sud":"Créditos de teste: 10 $ / 3 meses · os modelos Solar.","Maritaca · Brazilia":"Créditos gratuitos no registo · a família Sabiá, especializada em português.","Lume · modele naționale open-source (local)":"Modelos soberanos sem API alojada gratuita — executas-os em local com o Ollama (iniciado com OLLAMA_ORIGINS=*): «ollama pull falcon3» ou «ollama pull hf.co/<repo>» (exige GGUF; caso contrário procura a conversão da comunidade). ⟳ lista o que tens instalado.","Anthropic · Claude":"Pago, com a tua chave · CORS suportado oficialmente a partir do navegador (cabeçalho dedicado, já incluído na aplicação).","OpenAI":"Pago, com a tua chave · verifica os IDs exatos com ⟳ depois de colocares a chave.","xAI · Grok":"Pago, com a tua chave · ⟳ para a lista exata.","DeepSeek (direct)":"Pago mas muito barato — o passo mais acessível além do gratuito.","Perplexity · Sonar":"Pago, com a tua chave · modelos com pesquisa web integrada na resposta.","LLM7.io":"Gateway gratuito sem chave (token opcional para limites mais altos) · fiabilidade variável — verifica com ⚡ e usa ⟳ para a lista real.","Together AI":"Créditos de teste no registo · grande catálogo open-weight — ⟳ depois da chave.","Fireworks AI":"Créditos de teste: 1 $ · os IDs têm o prefixo accounts/fireworks/models/.","Nebius Token Factory":"Créditos de teste: 1 $ · se o endpoint diferir, tira-o da consola e corrige a Base URL.","Novita AI":"Créditos de teste: 0,5 $ válidos durante um ano.","Hyperbolic":"Créditos de teste: 1 $.","Inference.net":"Créditos de teste: 1 $ (25 $ com o questionário por e-mail) · ⟳ para os IDs exatos.","SambaNova":"Créditos de teste: 5 $ / 3 meses · inferência muito rápida.","Scaleway":"Créditos de teste: 1.000.000 de tokens grátis · alojamento na UE."},"groups":{"În browser · WebLLM (WebGPU)":"No navegador · WebLLM (WebGPU)","AI încorporat în browser · Gemini Nano":"IA integrada no navegador · Gemini Nano","România · OpenLLM-Ro (local)":"Roménia · OpenLLM-Ro (local)","Lume · modele naționale open-source (local)":"Mundo · modelos nacionais de código aberto (local)"},"frag":{"în browser":"no navegador","încorporat în browser":"integrado no navegador","Modelul încărcat":"Modelo carregado","Modelul servit":"Modelo servido","Modelul lansat":"Modelo iniciado","Modelul rulat":"Modelo em execução","Modelele găzduite":"Modelos alojados","Arabia Saudită":"Arábia Saudita","România":"Roménia"}},"de":{"notes":{"Pollinations":"Die alte API (text.pollinations.ai) wurde eingestellt und liefert 402 — die neue verlangt einen KOSTENLOSEN Schlüssel von enter.pollinations.ai: verwende einen pk_-Schlüssel (publishable), der ausdrücklich für den sicheren Einsatz im Browser gedacht ist · kostenloses Kontingent mit regelmäßig aufgefülltem Pollen · ⟳ funktioniert auch ohne Schlüssel (der Katalog ist öffentlich).","Kilo Gateway":"Die :free-Modelle funktionieren ohne Konto · 200 Anfragen/Stunde pro IP · Prompts können für Training verwendet werden · wenn du „Netzwerk/CORS blockiert“ erhältst, lehnt das Gateway Browser-Aufrufe aus deinem Netzwerk ab — leite es über einen lokalen LiteLLM-Proxy.","OpenCode Zen":"Kostenloser Schlüssel, ohne Karte · kostenlose, für Coding ausgewählte Modelle · Daten aus der kostenlosen Phase können zur Verbesserung der Modelle verwendet werden.","OpenRouter":"Kostenloser Schlüssel, ohne Karte · 20 Anfragen/Min., 50 Anfragen/Tag (1000/Tag nach einer einmaligen Aufladung von 10 $) · die :free-Modelle wechseln häufig.","Groq":"Free Tier, ohne Karte · sehr schnell (LPU) · ~1000 Anfragen/Tag bei den großen Modellen (Limits 2026 gesenkt).","Cerebras":"Kein dauerhaftes Gratis-Kontingent bestätigt: cerebras.ai/pricing nennt ein einmaliges Aktionsguthaben von 5 $ (Zahlungsmittel nötig, verfällt nach 30 Tagen) · schnellster Durchsatz (~2000 Tok/s) · Tageslimits nicht überprüft.","Google AI Studio":"Free Tier · Gemini Flash ~20 Anfragen/Tag, Flash-Lite ~500/Tag, Gemma ~14400/Tag · außerhalb der EU können Daten für Training genutzt werden · prüfe die genauen IDs in AI Studio.","Mistral La Plateforme":"Free Tier (Experiment) · erfordert Telefonverifizierung und Zustimmung zum Training mit Daten · großzügige Limits pro Modell.","NVIDIA NIM":"Kostenlos mit einem NVIDIA-Konto (Telefonverifizierung) · 40 Anfragen/Min. · Kontext teils begrenzt.","Cohere":"Kostenloser Testschlüssel · 20 Anfragen/Min., 1000 Anfragen/Monat (gemeinsames Kontingent).","HuggingFace Inference":"Kostenloses HF-Token · ~0,10 $/Monat an Inference-Providers-Guthaben · die IDs sind HF-Repos.","Cloudflare Workers AI":"10.000 Neuronen/Tag kostenlos · WICHTIG: Bearbeite das Modell nach dem Hinzufügen und ersetze CONT_ID in der Base URL durch deine Cloudflare-Account-ID.","Z.ai (Zhipu)":"Die Flash-Modelle sind mit Schlüssel kostenlos · Limits pro Modell.","ModelScope · 魔搭 (Alibaba)":"Kostenlos: 2000 Aufrufe/Tag insgesamt, max. 500/Modell (100/Tag bei den großen DeepSeek-Modellen) · erfordert ein Alibaba-Konto mit Identitätsprüfung · Qwen3.5 erscheint hier zuerst — nutze ⟳ für die vollständige Liste.","SiliconFlow · 硅基流动":"Kleine Modelle dauerhaft kostenlos + ~20 Mio. Tokens bei der Registrierung (CN-Konto; international: api.siliconflow.com, ~1 $ Guthaben) · die Liste der 0-¥-Modelle wechselt — nutze ⟳.","Tencent Hunyuan · 腾讯混元":"hunyuan-lite kostenlos + ~100 Mio. Tokens bei Aktivierung des Dienstes · Tencent-Cloud-Konto.","Baidu Qianfan · 百度千帆":"ERNIE Speed und Lite kostenlos · Baidu-Cloud-Konto.","iFlytek Spark · 讯飞星火":"Spark Lite kostenlos und unbegrenzt · der Schlüssel wird als APIKey:APISecret geschrieben (mit Doppelpunkt dazwischen).","Moonshot Kimi · 月之暗面":"Testguthaben bei der Registrierung · CN-Endpunkt: api.moonshot.cn/v1.","Alibaba Model Studio · 通义":"Test: 1.000.000 Tokens pro Modell, 90 Tage (Singapur-Endpunkt).","În browser · WebLLM (WebGPU)":"Die KI läuft direkt in dieser Seite, auf deiner GPU, über WebGPU — null Server, null Schlüssel. Bei der ersten Nutzung lädt sie das Modell (0,6–2 GB, danach bleibt es im Browser-Cache) und die Modellbibliothek (.wasm, fester Commit, per SHA-256 geprüft) herunter. Die WebLLM-Bibliothek selbst liegt in vendor/ — optional und nur von dir ausgelöst.","LM Studio (local)":"Starte den Server im Tab Developer und aktiviere CORS in den Servereinstellungen · ⟳ listet die geladenen Modelle auf — nutze es, die statische ID unten ist nur ein Anhaltspunkt.","Jan (local)":"Aktiviere den API Server in den Jan-Einstellungen (mit CORS) · ⟳ listet die installierten Modelle auf.","llama.cpp / llamafile (local)":"„llama-server -m model.gguf“ oder Doppelklick auf ein llamafile · der Server akzeptiert jede Modell-ID · CORS ist standardmäßig erlaubt.","GPT4All (local)":"Aktiviere „Local API Server“ unter Settings · ⟳ listet die Modelle auf.","KoboldCpp (local)":"OpenAI-kompatibler Endpunkt, standardmäßig aktiv auf Port 5001.","vLLM (local/server)":"„vllm serve <model>“ · für den Zugriff aus dem Browser mit --allowed-origins '[\"*\"]' starten.","AI încorporat în browser · Gemini Nano":"Prompt API in Chrome/Edge — das Modell wird vom Browser verwaltet und nur einmal heruntergeladen, läuft vollständig lokal, null externe Bibliotheken. Zeigt das Badge ⚡ ein ✗, aktiviere die integrierte KI in den Browsereinstellungen/Flags.","Transformers.js · WASM/WebGPU":"Führt ONNX in der Seite aus — auch OHNE WebGPU (Rückfall auf WASM), läuft also in fast jedem Browser. Bei der ersten Nutzung werden die ONNX-Runtime-Datei (.wasm, per SHA-256 geprüft) und das Modell von HuggingFace geladen und dann zwischengespeichert. Die Transformers.js-Bibliothek selbst liegt in vendor/.","LocalAI (local)":"Vollständiger OpenAI-kompatibler Server (Text/Bild/Audio) · ACHTUNG: Port 8080 ist auch der Standard von llama.cpp — ändere einen der beiden, wenn du beide betreibst · ⟳ listet die installierte Galerie auf.","Text Generation WebUI · oobabooga (local)":"Mit --api starten (und --api-cors, falls nötig) · Standardport 5000.","TabbyAPI · ExLlamaV2 (local)":"Schnelle EXL2-Inferenz auf der GPU · derselbe Port 5000 wie oobabooga — betreibe nur einen oder ändere den Port.","SGLang (local/server)":"„python -m sglang.launch_server --model-path <model>“ · Standardport 30000.","MLX · Apple Silicon (local)":"„mlx_lm.server --model <model>“ auf Mac M1–M4 · Standardport 8080 (Konflikt mit llama.cpp/LocalAI, wenn sie gleichzeitig laufen).","Aphrodite Engine (local/server)":"Serving-Engine mit hohem Durchsatz · Standardport 2242.","Cortex (local)":"Die Engine hinter Jan, auch eigenständig nutzbar („cortex run <model>“) · Standardport 39281.","Xinference (local/server)":"„xinference-local“ · Standardport 9997 · bedient LLM/Embeddings/Rerank.","FastChat (local/server)":"Der OpenAI-kompatible Server des LMSYS-Teams (der Macher der ursprünglichen Arena) · Port 8000 — Konflikt mit vLLM, wenn beide laufen.","LiteLLM Proxy (local · ruter)":"Lokaler Router zu über 100 Anbietern — alles, was du in litellm konfiguriert hast, erscheint hier über ⟳ · Standardport 4000.","Docker Model Runner (local)":"„docker model run ai/<model>“ aus Docker Desktop · OpenAI-kompatibler Endpunkt auf 12434 · aktiviere TCP-Host-Zugriff in den Docker-Einstellungen.","Foundry Local · Microsoft (local)":"„foundry model run <model>“ — führt Modelle aus dem Foundry-Katalog (Phi, Qwen, DeepSeek…) lokal mit NPU/GPU-Beschleunigung aus · der Port ist dynamisch: prüfe ihn mit „foundry service status“ und korrigiere die Base URL, falls er abweicht.","Lemonade · AMD (local · GPU+NPU)":"Der lokale AMD-Server: LLM + Stable Diffusion + Wh const KVault=new KV.Vault(SKEY+"-vault");

  if(k===SKEY+"-vault")return "";
  if(k!==SKEY)return v;
  try{const o=JSON.parse(v);if(o&&Array.isArray(o.models))o.models.forEach(m=>{if(m&&m.apiKey)m.apiKey="";});return JSON.stringify(o);}catch(e){return "";}
});

async function* demoStream(model,prompt,signal){

    if(signal.aborted){reader.cancel();return;}
    const {done,value}=await reader.read();
    if(done)break;

    }
  }
}

    const msg=[{role:"user",content:"ping"}];
    if(m.provider==="anthropic"){
      url=(m.baseUrl||"https://api.anthropic.com").replace(/\/+$/,"")+"/v1/messages";
      opts={method:"POST",headers:FFF.ai.anthropicHeaders(m.apiKey||""),
        body:JSON.stringify({model:m.model,max_tokens:1,messages:msg})};
    }else{
      let base=m.baseUrl||(m.provider==="openai"?"https://api.openai.com/v1":"");
      if(m.provider==="ollama"&&!base)base="http://localhost:11434/v1";
      if(m.provider==="pollinations"&&!base)base="https://gen.pollinations.ai/v1";
      url=base.replace(/\/+$/,"")+"/chat/completions";
      const h={"Content-Type":"application/json"};
      if(m.apiKey)h["Authorization"]="Bearer "+m.apiKey;
      opts={method:"POST",headers:h,body:JSON.stringify({model:m.model,max_tokens:1,messages:msg})};
    }
    if(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)opts.signal=AbortSignal.timeout(20000);
    let r=await fetch(url,opts);
    if(r.status===400&&m.provider!=="anthropic"){
      const b=JSON.parse(opts.body);delete b.max_tokens;b.max_completion_tokens=16;
      r=await fetch(url,{...opts,body:JSON.stringify(b)});
    }
    const ms=Math.round(performance.now()-t0);
    return r.ok?{ok:true,ms}:{ok:false,ms,code:r.status};
  }catch(e){return{ok:false,ms:Math.round(performance.now()-t0),code:e.name==="TimeoutError"?"timeout":"rețea"};}
}

/* ---------------- Elo ---------------- */
function eloUpdate(idA,idB,scoreA){ // scoreA: 1 / 0.5 / 0
  const A=rating(idA),B=rating(idB);
  const expA=1/(1+Math.pow(10,(B.elo-A.elo)/400));
  const K=32;
  const dA=Math.round(K*(scoreA-expA));
  A.elo+=dA;B.elo-=dA;
  A.m++;B.m++;
  if(scoreA===1){A.w++;B.l++;}else if(scoreA===0){A.l++;B.w++;}else{A.d++;B.d++;}
  return dA;
}

/* ---------------- duel flow ---------------- */
let duel=null; // {a,b,prompt,ctrl,done}
function setVote(on){["v-a","v-b","v-tie","v-bad"].forEach(id=>$(id).disabled=!on);}
function resetDuelUI(){
  $("d-pa").textContent="";$("d-pb").textContent="";
  $("d-ra").textContent="";$("d-rb").textContent="";
  $("d-da").textContent="";$("d-db").textContent="";
  $("d-da").className="delta";$("d-db").className="delta";
  $("d-wa").textContent="⚔ A";$("d-wb").textContent="⚔ B";
  $("d-verdict").classList.remove("on");$("d-post").classList.remove("on");
  setVote(false);
}
async function startDuel(){
  const prompt=$("d-prompt").value.trim();
  if(!prompt){toast(t("need_prompt"));return;}
  const pool=enabledModels();
  if(pool.length<2){toast(t("need2"));return;}
  if(duel?.ctrl)duel.ctrl.abort();
  resetDuelUI();
  const i=Math.floor(Math.random()*pool.length);
  let j=Math.floor(Math.random()*(pool.length-1));if(j>=i)j++;
  const ctrl=new AbortController();
  duel={a:pool[i],b:pool[j],prompt,ctrl,done:false,cat:(window.evCatFor?window.evCatFor(prompt):"")};
  const mine=duel;
  $("d-go").disabled=true;$("d-stop").style.display="";
  const [okA,okB]=await Promise.all([
    runInto(duel.a,prompt,$("d-pa"),ctrl.signal),
    runInto(duel.b,prompt,$("d-pb"),ctrl.signal)
  ]);
  if(duel!==mine)return; /* între timp a pornit alt duel (Stop + duel nou): nu atingem UI-ul lui */
  $("d-go").disabled=false;$("d-stop").style.display="none";
  if(ctrl.signal.aborted){resetDuelUI();duel=null;return;}
  if(!(okA&&okB)){
    $("d-verdict").textContent=t("verdict_err");$("d-verdict").classList.add("on");
    $("d-post").classList.add("on");
    duel=null;return;
  }
  duel.done=true;
  setVote(true);
}
function reveal(scoreA,verdictKey){
  if(!duel||!duel.done)return;
  setVote(false);
  const dA=eloUpdate(duel.a.id,duel.b.id,scoreA);
  S.history.push({ts:Date.now(),a:duel.a.id,b:duel.b.id,s:scoreA,p:duel.prompt.slice(0,140),c:duel.cat||""});
  if(S.history.length>500)S.history=S.history.slice(-500);
  saveState();
  $("d-wa").textContent=duel.a.name;$("d-wb").textContent=duel.b.name;
  $("d-ra").textContent=t("was")+" A";$("d-rb").textContent=t("was")+" B";
  const da=$("d-da"),db=$("d-db");
  da.textContent=(dA>=0?"+":"")+dA+" Elo";db.textContent=(dA<=0?"+":"")+(-dA)+" Elo";
  da.className="delta "+(dA>0?"up":dA<0?"down":"");
  db.className="delta "+(dA<0?"up":dA>0?"down":"");
  $("d-verdict").textContent=t(verdictKey);$("d-verdict").classList.add("on");
  $("d-post").classList.add("on");
}
